<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0e3b2e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
<title>المصحف الشريف — زاد</title>
<meta name="description" content="المصحف الشريف كاملًا داخل زاد: نصّ عثماني محلي يعمل بلا إنترنت، تفسير ميسّر، بحث فوري، وثلاث طرق للقراءة — بلا إعلانات ولا حساب.">
<link rel="preload" href="fonts/amiri-quran.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/style.min.css">
<link rel="stylesheet" href="css/premium-ui.min.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   قارئ المصحف — طبقة عرض مستقلة (تعتمد على متغيّرات التصميم العامة)
   ═══════════════════════════════════════════════════════════════════════ */
@font-face{
  font-family:'AmiriQuran';
  src:url('fonts/amiri-quran.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap;
}
html,body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}

.mq{
  --mq-p1:#fffdf7; --mq-p2:#f8eeda;
  --mq-ink:#1a2b24;
  --mq-gold:#8a6a1f;
  --mq-gold-2:#b08a2e;
  --mq-rule:rgba(138,106,31,.26);
  --mq-wash:rgba(201,161,74,.11);
  --mq-card:#fffdf8;
  max-width:900px;margin:0 auto;
}
html[data-theme="dark"] .mq{
  --mq-p1:#1b1609; --mq-p2:#110d05;
  --mq-ink:#ece3cf; --mq-gold:#dcb56a; --mq-gold-2:#c9a14a;
  --mq-rule:rgba(220,181,106,.22); --mq-wash:rgba(201,161,74,.13);
  --mq-card:#141008;
}
html[data-theme="oled"] .mq{
  --mq-p1:#0b0903; --mq-p2:#050400;
  --mq-ink:#e8dfcb; --mq-gold:#d7b274; --mq-gold-2:#c9a14a;
  --mq-rule:rgba(215,178,116,.18); --mq-wash:rgba(201,161,74,.10);
  --mq-card:#0a0802;
}
body.mq-night .mq{
  --mq-p1:#151109; --mq-p2:#0b0803;
  --mq-ink:#d6cbb2; --mq-gold:#c4a468; --mq-rule:rgba(196,164,104,.2);
  --mq-card:#100c05;
}

/* ── الشريط العلوي ─────────────────────────────────────────────────── */
.mq-bar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;
  padding:9px 12px;margin-bottom:10px;border-radius:16px;
  background:var(--card);border:1px solid var(--border);
  box-shadow:0 10px 30px -24px rgba(9,32,24,.6);
}
.mq-ico{
  width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;
  border-radius:11px;border:1px solid transparent;background:transparent;
  color:var(--ink);cursor:pointer;transition:.18s;padding:0;
}
.mq-ico:hover{background:var(--sand);border-color:var(--border)}
.mq-ico:active{transform:scale(.94)}
.mq-ico.on{background:var(--gold-pale);border-color:rgba(201,161,74,.4);color:var(--gold-dark)}
.mq-ico svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.mq-loc{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:700;color:var(--ink)}
.mq-loc #mq-loc-surah{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mq-loc .mq-dot{color:var(--gold);font-size:10px}
.mq-loc #mq-loc-juz{color:var(--muted);font-weight:600;white-space:nowrap;font-size:12px}
.mq-acts{display:flex;gap:2px;flex:0 0 auto}

/* ── أوضاع القراءة ─────────────────────────────────────────────────── */
.mq-modes{
  display:flex;gap:4px;padding:4px;margin-bottom:12px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
}
.mq-mode{
  flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  padding:9px 6px;border:none;border-radius:10px;background:transparent;
  font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);
  cursor:pointer;transition:.2s;
}
.mq-mode svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mq-mode:hover{color:var(--ink)}
.mq-mode.on{background:var(--primitive-green-700,#0e3b2e);color:#fff;box-shadow:0 6px 16px -10px rgba(14,59,46,.9)}
html[data-theme="dark"] .mq-mode.on,html[data-theme="oled"] .mq-mode.on{background:var(--gold);color:#221a06}

/* ── الورد + الاستئناف ────────────────────────────────────────────── */
.mq-wird{
  position:relative;display:flex;align-items:center;gap:10px;
  padding:9px 14px;margin-bottom:10px;border-radius:12px;overflow:hidden;
  background:linear-gradient(135deg,rgba(14,59,46,.06),rgba(201,161,74,.1));
  border:1px solid var(--mq-rule);font-size:12px;font-weight:700;color:var(--ink);
}
.mq-wird-bar{position:absolute;inset-inline-start:0;bottom:0;height:2px;width:100%;background:rgba(201,161,74,.18)}
.mq-wird-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mq-gold),var(--mq-gold-2));transition:width .45s ease}
.mq-wird-tag{color:var(--mq-gold)}

.mq-resume{margin-bottom:10px}
.mq-resume-btn{
  width:100%;display:flex;align-items:center;gap:12px;text-align:right;
  padding:12px 14px;border-radius:14px;cursor:pointer;font-family:inherit;
  background:var(--card);border:1px dashed rgba(201,161,74,.5);
  color:var(--ink);transition:.2s;
}
.mq-resume-btn:hover{border-style:solid;background:var(--gold-pale)}
.mq-resume-ico{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;background:var(--gold-pale);color:var(--gold-dark);font-size:16px}
.mq-resume-btn b{display:block;font-size:13.5px}
.mq-resume-btn small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.mq-resume-go{margin-inline-start:auto;font-size:11.5px;font-weight:800;color:var(--gold-dark);white-space:nowrap}

/* ── ورقة المصحف ──────────────────────────────────────────────────── */
.mq-stage{position:relative}
.mq-paper{
  position:relative;border-radius:20px;padding:30px clamp(16px,4.4vw,40px) 22px;
  background:
    radial-gradient(130% 90% at 50% -25%,var(--mq-wash),transparent 62%),
    linear-gradient(178deg,var(--mq-p1),var(--mq-p2));
  box-shadow:0 24px 60px -40px rgba(8,30,22,.75),0 1px 0 rgba(255,255,255,.5) inset,0 0 0 1px var(--mq-rule);
  overflow:hidden;
}
html[data-theme="dark"] .mq-paper,html[data-theme="oled"] .mq-paper,body.mq-night .mq-paper{box-shadow:0 24px 60px -40px #000,0 0 0 1px var(--mq-rule)}
.mq-paper::before{
  content:'';position:absolute;inset:9px;border:1px solid var(--mq-rule);
  border-radius:13px;pointer-events:none;opacity:.75;
}
.mq-paper::after{
  content:'';position:absolute;inset:9px;border-radius:13px;pointer-events:none;opacity:.55;
  background-image:
    url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PGcgZmlsbD0nbm9uZScgc3Ryb2tlPScjYzlhMTRhJyBzdHJva2Utd2lkdGg9JzEnPjxyZWN0IHg9JzUnIHk9JzUnIHdpZHRoPScxNCcgaGVpZ2h0PScxNCcgcng9JzInLz48cmVjdCB4PSc1JyB5PSc1JyB3aWR0aD0nMTQnIGhlaWdodD0nMTQnIHJ4PScyJyB0cmFuc2Zvcm09J3JvdGF0ZSg0NSAxMiAxMiknLz48L2c+PC9zdmc+"),
    url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PGcgZmlsbD0nbm9uZScgc3Ryb2tlPScjYzlhMTRhJyBzdHJva2Utd2lkdGg9JzEnPjxyZWN0IHg9JzUnIHk9JzUnIHdpZHRoPScxNCcgaGVpZ2h0PScxNCcgcng9JzInLz48cmVjdCB4PSc1JyB5PSc1JyB3aWR0aD0nMTQnIGhlaWdodD0nMTQnIHJ4PScyJyB0cmFuc2Zvcm09J3JvdGF0ZSg0NSAxMiAxMiknLz48L2c+PC9zdmc+"),
    url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PGcgZmlsbD0nbm9uZScgc3Ryb2tlPScjYzlhMTRhJyBzdHJva2Utd2lkdGg9JzEnPjxyZWN0IHg9JzUnIHk9JzUnIHdpZHRoPScxNCcgaGVpZ2h0PScxNCcgcng9JzInLz48cmVjdCB4PSc1JyB5PSc1JyB3aWR0aD0nMTQnIGhlaWdodD0nMTQnIHJ4PScyJyB0cmFuc2Zvcm09J3JvdGF0ZSg0NSAxMiAxMiknLz48L2c+PC9zdmc+"),
    url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PGcgZmlsbD0nbm9uZScgc3Ryb2tlPScjYzlhMTRhJyBzdHJva2Utd2lkdGg9JzEnPjxyZWN0IHg9JzUnIHk9JzUnIHdpZHRoPScxNCcgaGVpZ2h0PScxNCcgcng9JzInLz48cmVjdCB4PSc1JyB5PSc1JyB3aWR0aD0nMTQnIGhlaWdodD0nMTQnIHJ4PScyJyB0cmFuc2Zvcm09J3JvdGF0ZSg0NSAxMiAxMiknLz48L2c+PC9zdmc+");
  background-repeat:no-repeat;
  background-size:15px 15px;
  background-position:left 7px top 7px,right 7px top 7px,left 7px bottom 7px,right 7px bottom 7px;
}

.mq-runhead{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding-bottom:10px;margin-bottom:16px;border-bottom:1px solid var(--mq-rule);
  font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--mq-gold);
}
.mq-run-surah{font-family:'ThmanyahSerifDisplay',serif;font-size:13.5px;letter-spacing:0}
.mq-run-mid{font-size:8px;opacity:.8}
.mq-run-juz{color:var(--muted);font-weight:700}

.mq-band{
  position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px 12px;margin:14px 0 10px;padding:0 8px;
}
.mq-band::before,.mq-band::after{
  content:'';flex:1 1 40px;height:1px;min-width:28px;
  background:linear-gradient(90deg,transparent,var(--mq-rule));
}
.mq-band::after{background:linear-gradient(90deg,var(--mq-rule),transparent)}
.mq-band-name{
  font-family:'ThmanyahSerifDisplay',serif;font-size:17px;color:var(--mq-gold);
  padding:5px 20px;border:1px solid var(--mq-rule);border-radius:99px;
  background:linear-gradient(180deg,rgba(201,161,74,.1),rgba(201,161,74,.02));
  white-space:nowrap;
}
.mq-band-meta{flex-basis:100%;text-align:center;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.04em}

.mq-basmala{
  display:flex;align-items:center;justify-content:center;gap:14px;
  font-family:'AmiriQuran','Amiri Quran',serif;
  font-size:calc(var(--mq-size,26px) * .86);
  color:var(--mq-gold);margin:2px 0 16px;line-height:1.9;
}
.mq-b-orn{width:38px;height:1px;background:linear-gradient(90deg,transparent,var(--mq-rule));flex:0 0 auto}
.mq-b-orn:last-child{background:linear-gradient(90deg,var(--mq-rule),transparent)}

.mq-flow{
  font-family:'AmiriQuran','Amiri Quran',serif;
  font-size:var(--mq-size,26px);line-height:var(--mq-lh,2.55);
  color:var(--mq-ink);text-align:justify;text-justify:inter-word;
  word-spacing:.03em;
  -webkit-font-feature-settings:"liga","calt";
  font-feature-settings:"liga","calt";
}
.mq-a{
  cursor:pointer;border-radius:7px;transition:background .25s,box-shadow .25s;
  -webkit-tap-highlight-color:transparent;
}
.mq-a:hover,.mq-a:focus-visible{background:var(--mq-wash);outline:none;box-shadow:0 0 0 3px rgba(201,161,74,.12)}
.mq-a.is-flash{background:rgba(201,161,74,.32);box-shadow:0 0 0 5px rgba(201,161,74,.16)}

.mq-rose{
  display:inline-flex;align-items:center;justify-content:center;
  width:1.62em;height:1.62em;margin:0 .16em;vertical-align:-.3em;
  font-family:'ThmanyahSans','IBM Plex Sans Arabic',sans-serif;
  font-size:.42em;font-weight:800;color:var(--mq-gold);line-height:1;
  background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA0MCA0MCc+PGcgZmlsbD0nbm9uZScgc3Ryb2tlPScjYzlhMTRhJyBzdHJva2Utd2lkdGg9JzEuMyc+PHJlY3QgeD0nNycgeT0nNycgd2lkdGg9JzI2JyBoZWlnaHQ9JzI2JyByeD0nMycvPjxyZWN0IHg9JzcnIHk9JzcnIHdpZHRoPScyNicgaGVpZ2h0PScyNicgcng9JzMnIHRyYW5zZm9ybT0ncm90YXRlKDQ1IDIwIDIwKScvPjwvZz48L3N2Zz4=") center/contain no-repeat;
  pointer-events:none;
}
.mq-sajda{color:var(--mq-gold);font-size:.8em;margin:0 .1em}

.mq-seal-line{
  display:flex;align-items:center;gap:14px;margin-top:20px;padding-top:12px;
  border-top:1px solid var(--mq-rule);
}
.mq-seal-line::before,.mq-seal-line::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--mq-rule))}
.mq-seal-line::after{background:linear-gradient(90deg,var(--mq-rule),transparent)}
.mq-seal{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:2.2em;height:2.2em;padding:0 .55em;border-radius:99px;
  border:1px solid var(--mq-rule);color:var(--mq-gold);
  font-family:'ThmanyahSans',sans-serif;font-size:11.5px;font-weight:800;
  background:radial-gradient(circle at 50% 25%,rgba(201,161,74,.16),transparent 72%);
}

/* ── وضع الآية / التفسير ──────────────────────────────────────────── */
.mq-card{
  position:relative;margin:0 0 12px;padding:15px 17px;border-radius:15px;
  background:var(--mq-card);border:1px solid var(--mq-rule);
  cursor:pointer;transition:border-color .2s,box-shadow .2s,transform .2s;
}
.mq-card:hover{border-color:rgba(201,161,74,.5);box-shadow:0 10px 26px -22px rgba(9,32,24,.8)}
.mq-card:focus-visible{outline:none;border-color:var(--mq-gold);box-shadow:0 0 0 3px rgba(201,161,74,.18)}
.mq-card.is-flash{border-color:var(--mq-gold);background:rgba(201,161,74,.1)}
.mq-card-hd{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.mq-cnum{
  display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 7px;
  border-radius:8px;background:var(--gold-pale);color:var(--gold-dark);
  font-family:'ThmanyahSans',sans-serif;font-size:11.5px;font-weight:800;
}
.mq-csurah{font-size:11.5px;font-weight:700;color:var(--muted)}
.mq-ctag{font-size:10px;font-weight:800;color:var(--mq-gold);border:1px solid var(--mq-rule);border-radius:99px;padding:1px 8px}
.mq-cmore{margin-inline-start:auto;color:var(--muted);font-size:16px;line-height:1;letter-spacing:1px}
.mq-cpage{margin-inline-start:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--sand);border:1px solid var(--border);border-radius:99px;padding:2px 9px;white-space:nowrap}
.mq-ctext{
  margin:0;font-family:'AmiriQuran','Amiri Quran',serif;
  font-size:calc(var(--mq-size,26px) * .9);line-height:2.05;
  color:var(--mq-ink);text-align:justify;text-justify:inter-word;
}

/* ── التفسير ──────────────────────────────────────────────────────── */
.mq-taf{margin-top:13px;padding-top:12px;border-top:1px dashed var(--mq-rule)}
.mq-taf-hd{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.mq-taf-src{
  font-size:10.5px;font-weight:800;letter-spacing:.03em;color:var(--mq-gold);
  border:1px solid var(--mq-rule);border-radius:99px;padding:2px 10px;
}
.mq-taf-note{font-size:10.5px;color:var(--muted)}
.mq-taf-txt{font-size:14.5px;line-height:2;color:var(--ink);text-align:justify}
.mq-taf-txt p{margin:0 0 8px}
.mq-taf-txt p:last-child{margin-bottom:0}
.mq-quote{font-family:'AmiriQuran',serif;color:var(--mq-gold);font-size:1.06em;white-space:nowrap}
.mq-taf-empty{font-size:12.5px;color:var(--muted);text-align:center;padding:10px 0}
.mq-link{background:none;border:none;font-family:inherit;font-size:inherit;color:var(--gold-dark);text-decoration:underline;cursor:pointer;padding:0}

.mq-skel{display:flex;flex-direction:column;gap:7px;padding:4px 0}
.mq-skel i{display:block;height:9px;border-radius:5px;background:linear-gradient(90deg,var(--sand) 0%,var(--border) 40%,var(--sand) 80%);background-size:220% 100%;animation:mqShimmer 1.3s linear infinite}
.mq-skel i:nth-child(1){width:92%}.mq-skel i:nth-child(2){width:86%}.mq-skel i:nth-child(3){width:64%}.mq-skel i:nth-child(4){width:78%}
@keyframes mqShimmer{from{background-position:120% 0}to{background-position:-120% 0}}

/* ── هيكل التحميل ─────────────────────────────────────────────────── */
.mq-skel-paper{min-height:320px}
.mq-skel-lines{display:flex;flex-direction:column;gap:14px;padding-top:8px}
.mq-skel-lines span{display:block;height:11px;border-radius:6px;background:linear-gradient(90deg,var(--mq-wash),rgba(0,0,0,.05),var(--mq-wash));background-size:220% 100%;animation:mqShimmer 1.4s linear infinite}

.mq-errcard{text-align:center;padding:44px 24px}
.mq-err-ico{font-size:34px;margin-bottom:10px}
.mq-errcard h3{margin:0 0 8px;font-size:16px;color:var(--mq-ink)}
.mq-errcard p{margin:0 auto 18px;font-size:13px;line-height:1.9;color:var(--muted);max-width:44ch}
.mq-err-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ── أزرار ────────────────────────────────────────────────────────── */
.mq-btn{
  padding:9px 18px;border-radius:11px;border:1px solid var(--border);
  background:var(--card);color:var(--ink);font-family:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;transition:.18s;
}
.mq-btn:hover{border-color:var(--gold)}
.mq-btn.solid{background:var(--primitive-green-700,#0e3b2e);color:#fff;border-color:transparent}
.mq-btn.solid:hover{filter:brightness(1.12)}
.mq-btn.done{background:rgba(26,154,90,.12);color:var(--primitive-green-700,#0e3b2e);border-color:rgba(26,154,90,.3)}
.mq-btn.danger{background:transparent;color:#b3261e;border-color:rgba(179,38,30,.3)}
.mq-btn.wide{width:100%;margin-top:10px}
.mq-btn[disabled]{opacity:.6;cursor:default}

/* ── تنقّل الصفحات ────────────────────────────────────────────────── */
.mq-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 6px}
.mq-nbtn{
  display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);color:var(--ink);
  font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;transition:.18s;
}
.mq-nbtn:hover:not([disabled]){border-color:var(--gold);background:var(--gold-pale)}
.mq-nbtn[disabled]{opacity:.35;cursor:default}
.mq-nbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mq-pbtn{
  display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:42px;padding:0 16px;
  border-radius:99px;border:1px solid var(--mq-rule);background:var(--card);
  color:var(--mq-gold);font-family:'ThmanyahSans',sans-serif;font-size:14px;font-weight:800;cursor:pointer;
  transition:.18s;
}
.mq-pbtn:hover{background:var(--gold-pale)}

/* ── الشيت ────────────────────────────────────────────────────────── */
.mq-sheet{
  position:fixed;inset:0;z-index:900;display:flex;align-items:flex-end;justify-content:center;
  background:rgba(6,22,17,.52);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  opacity:0;pointer-events:none;transition:opacity .24s ease;
}
.mq-sheet.on{opacity:1;pointer-events:auto}
.mq-sheet-in{
  position:relative;width:min(700px,100%);max-height:88vh;overflow:auto;overscroll-behavior:contain;
  background:var(--card);border-radius:22px 22px 0 0;padding:26px 20px 30px;
  transform:translateY(18px);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -20px 60px -30px rgba(0,0,0,.5);
}
.mq-sheet.on .mq-sheet-in{transform:none}
.mq-sheet-in::before{
  content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:42px;height:4px;border-radius:99px;background:var(--border);
}
.mq-sheet-x{
  position:absolute;top:12px;inset-inline-end:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--border);background:var(--card);color:var(--muted);
  font-size:15px;cursor:pointer;display:grid;place-items:center;
}
.mq-sheet-hd{margin:2px 0 16px;padding-inline-end:44px}
.mq-sheet-hd h2{margin:0;font-size:17px;font-weight:800;color:var(--ink)}
.mq-sheet-hd p{margin:3px 0 0;font-size:12px;color:var(--muted)}
.mq-sheet-body{font-size:14px;color:var(--ink)}
@media(min-width:760px){
  .mq-sheet{align-items:center}
  .mq-sheet-in{border-radius:22px;max-height:84vh}
  .mq-sheet-in::before{display:none}
}

/* آية داخل الشيت */
.mq-verse{
  font-family:'AmiriQuran','Amiri Quran',serif;font-size:calc(var(--mq-size,26px) * 1.02);
  line-height:2.15;text-align:justify;color:var(--mq-ink);
  background:linear-gradient(180deg,rgba(201,161,74,.09),rgba(201,161,74,.02));
  border:1px solid var(--mq-rule);border-radius:14px;padding:18px 18px 14px;margin-bottom:14px;
}
.mq-sheet-body .mq-acts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.mq-act{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;
  border-radius:12px;border:1px solid var(--border);background:var(--card);
  font-family:inherit;font-size:11px;font-weight:700;color:var(--ink);cursor:pointer;transition:.18s;
}
.mq-act span{font-size:15px;line-height:1}

/* أيقونات مقنّعة عامة (لا تُمحى مع تغيير النص) */

.mq-libico .mq-mi{width:21px;height:21px}
.mq-empty-ico .mq-mi{width:30px;height:30px}
.mq-err-ico .mq-mi{width:34px;height:34px}


/* أيقونات أزرار الآية (بدل الإيموجي) */
.mq-act .mq-ai{width:16px;height:16px;flex:0 0 auto;background:currentColor;display:inline-block;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.mq-act[data-act="copy"] .mq-ai{--m:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PHJlY3QgeD0nOScgeT0nOScgd2lkdGg9JzExJyBoZWlnaHQ9JzExJyByeD0nMi40JyBmaWxsPSdub25lJyBzdHJva2U9J2JsYWNrJyBzdHJva2Utd2lkdGg9JzEuOCcvPjxwYXRoIGQ9J002LjUgMTVINS40QTEuOSAxLjkgMCAwIDEgMy41IDEzLjFWNS40QTEuOSAxLjkgMCAwIDEgNS40IDMuNWg3LjdBMS45IDEuOSAwIDAgMSAxNSA1LjR2MS4xJyBmaWxsPSdub25lJyBzdHJva2U9J2JsYWNrJyBzdHJva2Utd2lkdGg9JzEuOCcgc3Ryb2tlLWxpbmVjYXA9J3JvdW5kJy8+PC9zdmc+");-webkit-mask-image:var(--m);mask-image:var(--m)}

.mq-act[data-act="open-page"] .mq-ai{--m:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PHBhdGggZD0nTTEyIDYuNVM5LjUgNCA1IDR2MTNjNC41IDAgNyAyLjUgNyAyLjVTMTQuNSAxNyAxOSAxN1Y0Yy00LjUgMC03IDIuNS03IDIuNXonIGZpbGw9J25vbmUnIHN0cm9rZT0nYmxhY2snIHN0cm9rZS13aWR0aD0nMS42Jy8+PHBhdGggZD0nTTEyIDYuNXYxMycgc3Ryb2tlPSdibGFjaycgc3Ryb2tlLXdpZHRoPScxLjYnLz48L3N2Zz4=");-webkit-mask-image:var(--m);mask-image:var(--m)}

.mq-act:hover,.mq-act.on{border-color:var(--gold);background:var(--gold-pale);color:var(--gold-dark)}
.mq-intro{margin-bottom:12px;border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:var(--sand)}
.mq-intro summary{cursor:pointer;font-size:12.5px;font-weight:800;color:var(--gold-dark)}
.mq-intro .mq-taf-txt{margin-top:8px;font-size:13.5px}

/* ── قوائم ────────────────────────────────────────────────────────── */
.mq-row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;
  padding:11px 12px;margin-bottom:6px;border-radius:12px;
  border:1px solid transparent;background:transparent;cursor:pointer;
  font-family:inherit;color:var(--ink);transition:.16s;
}
.mq-row:hover{background:var(--sand);border-color:var(--border)}
.mq-row-num{
  flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  background:var(--gold-pale);color:var(--gold-dark);font-size:11.5px;font-weight:800;
}
.mq-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mq-row-main b{font-size:13.5px;font-weight:800}
.mq-row-ayah .mq-row-main small{font-family:'AmiriQuran',serif;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-row-main small{font-size:11.5px;color:var(--muted)}
.mq-row-side{flex:0 0 auto;font-size:11px;font-weight:800;color:var(--gold-dark);white-space:nowrap}
.mq-sec-title{
  display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:12px;font-weight:800;color:var(--muted);
}
.mq-sec-title:first-child{margin-top:0}
.mq-sec-title span{margin-inline-start:auto;font-size:11px;color:var(--gold-dark)}
.mq-empty{text-align:center;padding:34px 16px;color:var(--muted)}
.mq-empty-ico{font-size:30px;margin-bottom:8px}
.mq-empty p{margin:0 0 4px;font-size:14px;font-weight:700;color:var(--ink)}
.mq-empty small{font-size:12px;line-height:1.8;display:block;max-width:34ch;margin:0 auto}
.mq-empty.small{padding:18px}

/* فهرس السور */
.mq-searchbox{position:relative;display:flex;gap:8px;margin-bottom:8px}
.mq-searchbox input{
  flex:1;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--sand);color:var(--ink);font-family:inherit;font-size:13.5px;outline:none;
}
.mq-searchbox input:focus{border-color:var(--gold);background:var(--card)}
.mq-search-go{
  padding:0 16px;border-radius:12px;border:none;background:var(--primitive-green-700,#0e3b2e);
  color:#fff;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;
}
.mq-idx{max-height:56vh;overflow:auto;margin:0 -4px;padding:0 4px}
.mq-srow{
  display:flex;align-items:center;gap:12px;width:100%;text-align:right;
  padding:9px 8px;border-radius:11px;border:none;background:transparent;cursor:pointer;
  font-family:inherit;color:var(--ink);border-bottom:1px solid var(--border);
}
.mq-srow:last-child{border-bottom:none}
.mq-srow:hover{background:var(--sand)}
.mq-snum{
  flex:0 0 auto;width:32px;height:32px;display:grid;place-items:center;
  font-family:'ThmanyahSans',sans-serif;font-size:11px;font-weight:800;color:var(--mq-gold);
  background:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCA0MCA0MCc+PGcgZmlsbD0nbm9uZScgc3Ryb2tlPScjYzlhMTRhJyBzdHJva2Utd2lkdGg9JzEuMic+PHJlY3QgeD0nNycgeT0nNycgd2lkdGg9JzI2JyBoZWlnaHQ9JzI2JyByeD0nMycvPjxyZWN0IHg9JzcnIHk9JzcnIHdpZHRoPScyNicgaGVpZ2h0PScyNicgcng9JzMnIHRyYW5zZm9ybT0ncm90YXRlKDQ1IDIwIDIwKScvPjwvZz48L3N2Zz4=") center/contain no-repeat;
}
.mq-smain{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.mq-smain b{font-size:13.5px;font-weight:700}
.mq-smain small{font-size:11px;color:var(--muted)}
.mq-smeta{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}

/* الأجزاء */
.mq-juzgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.mq-juzcell{
  display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 6px;
  border-radius:12px;border:1px solid var(--border);background:var(--card);
  font-family:inherit;cursor:pointer;transition:.18s;color:var(--ink);
}
.mq-juzcell:hover{border-color:var(--gold);background:var(--gold-pale);transform:translateY(-1px)}
.mq-juzcell b{font-family:'ThmanyahSans',sans-serif;font-size:16px;color:var(--gold-dark)}
.mq-juzcell small{font-size:10.5px;color:var(--muted)}

/* البحث */
.mq-search-state{font-size:12px;color:var(--muted);margin:10px 2px 8px}
.mq-search-state.ok{color:var(--primitive-green-700,#0e3b2e)}
html[data-theme="dark"] .mq-search-state.ok,html[data-theme="oled"] .mq-search-state.ok{color:#7fce9a}
.mq-results{max-height:58vh;overflow:auto;margin:0 -4px;padding:0 4px}
.mq-hit{
  display:block;width:100%;text-align:right;padding:11px 12px;margin-bottom:7px;
  border-radius:12px;border:1px solid var(--border);background:var(--card);
  cursor:pointer;font-family:inherit;color:var(--ink);transition:.16s;
}
.mq-hit:hover{border-color:var(--gold);background:var(--gold-pale)}
.mq-hit-top{display:flex;align-items:center;gap:8px;margin-bottom:5px;font-size:11px;color:var(--muted)}
.mq-hit-top b{font-size:11.5px;color:var(--gold-dark);font-weight:800}
.mq-hit-txt{
  display:block;font-family:'AmiriQuran',serif;font-size:17px;line-height:2;color:var(--ink);
  text-align:justify;
}
.mq-hit-txt mark{background:rgba(201,161,74,.34);color:inherit;border-radius:3px;padding:0 1px}
html[data-theme="dark"] .mq-hit-txt mark,html[data-theme="oled"] .mq-hit-txt mark{background:rgba(220,181,106,.28)}

/* المكتبة */
.mq-libcard{border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;background:var(--card)}
.mq-libhd{display:flex;align-items:center;gap:11px;margin-bottom:11px}
.mq-libico{width:38px;height:38px;display:grid;place-items:center;border-radius:11px;background:var(--gold-pale);color:var(--gold-dark);flex:0 0 auto}
.mq-libhd b{display:block;font-size:13.5px}
.mq-libhd small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.mq-libbar{height:6px;border-radius:99px;background:var(--sand);overflow:hidden;margin-bottom:10px}
.mq-libbar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mq-gold),var(--mq-gold-2));transition:width .4s ease}
.mq-libfoot{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--muted);font-weight:700}
.mq-libfoot .mq-btn{margin-inline-start:auto}
.mq-libnote{font-size:11.5px;line-height:1.9;color:var(--muted);text-align:center;margin:6px 0 12px}

/* الإعدادات */
.mq-lbl{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:800;color:var(--ink);margin:16px 0 6px}
.mq-lbl output{font-size:12px;color:var(--gold-dark)}
.mq-range{
  -webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;
  background:var(--sand);outline:none;margin:4px 0 2px;
}
.mq-range::-webkit-slider-thumb{
  -webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--primitive-green-700,#0e3b2e);border:3px solid var(--card);
  box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;
}
.mq-range::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--primitive-green-700,#0e3b2e);border:3px solid var(--card);cursor:pointer}
.mq-switchrow{display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px;font-size:12.5px;font-weight:800;color:var(--ink)}
.mq-switch{
  width:48px;height:27px;border-radius:99px;border:none;background:var(--border);
  position:relative;cursor:pointer;transition:.22s;padding:0;flex:0 0 auto;
}
.mq-switch i{position:absolute;top:3px;inset-inline-start:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.22s;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.mq-switch.on{background:var(--primitive-green-700,#0e3b2e)}
.mq-switch.on i{inset-inline-start:24px}
.mq-set-note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}

/* ── توست ─────────────────────────────────────────────────────────── */
.mq-toast{
  position:fixed;bottom:22px;left:50%;transform:translate(-50%,16px);
  background:var(--primitive-green-900,#0b3024);color:#f6efdc;
  padding:11px 20px;border-radius:99px;font-size:12.5px;font-weight:700;
  box-shadow:0 14px 40px -18px rgba(0,0,0,.7);z-index:1000;
  opacity:0;pointer-events:none;transition:.25s;
  max-width:88vw;text-align:center;
}
.mq-toast.on{opacity:1;transform:translate(-50%,0)}
body.mq-lock{overflow:hidden}

/* ── حركة الدخول ──────────────────────────────────────────────────── */
.mq-enter{animation:mqIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes mqIn{from{opacity:0;transform:translateY(10px) scale(.995)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){
  .mq-enter{animation:none}
  .mq-sheet-in{transition:none}
  .mq-skel i,.mq-skel-lines span{animation:none}
}

/* ── موبايل ───────────────────────────────────────────────────────── */
@media(max-width:640px){
  .mq-paper{padding:22px 15px 18px;border-radius:16px}
  .mq-bar{padding:7px 8px;border-radius:13px}
  .mq-ico{width:34px;height:34px}
  .mq-loc{font-size:12.5px}
  .mq-loc #mq-loc-juz{display:none}
  .mq-band-name{font-size:15px;padding:4px 16px}
  .mq-sheet-body .mq-acts{grid-template-columns:repeat(4,1fr);gap:6px}
  .mq-nav{gap:6px}
  .mq-nbtn{padding:9px 12px;font-size:11.5px}
  .mq-toast{bottom:16px}
}

.mq-ico::before,.mq-mode::before,.mq-nbtn::before,.mq-nbtn::after{
  -webkit-mask-image:var(--m);mask-image:var(--m);
}


/* سطح القراءة نظيف: لا أزرار عائمة فوق الآيات */
.zad-tkbr-fab{display:none!important}
.scroll-top-btn{bottom:96px}

/* [hidden] لا يعمل لو القاعدة نفسها بتضبط display — نُصلحها صراحةً */
.mq [hidden],.mq-wird[hidden],.mq-resume[hidden]{display:none!important}

/* الشريط اللاصق تحت التوپ بار العائم على الموبايل */
@media(max-width:900px){
  .mq-bar{top:calc(8px + var(--tb-h,56px));z-index:59;box-shadow:0 6px 22px -18px rgba(9,32,24,.55)}
}

/* ترويسة الصفحة: بلا تكرار اسم السورة (البطاقة تحته فيها الاسم) */
.mq-runhead{justify-content:space-between;gap:8px;padding:0 20px}
.mq-runhead .mq-run-mid{flex:0 0 auto}


/* ── إصلاح الشريط اللاصق ────────────────────────────────────────────────
   أي سلف بـ overflow:hidden/auto يخلق حاوية تمرير تُلغي sticky وتهبط بالشريط
   بمقدار top (كان الشريط ينزل 70px فوق شريط الأوضاع ويغطيه).
   clip يقص أفقيًا دون إنشاء حاوية تمرير. */
html,body,.app,.main{overflow-x:clip!important;overflow-y:visible!important}

/* زرّ الأوامر العائم كان يقف فوق الآيات أثناء القراءة */
#zad-cmd-fab{display:none!important}
@media(max-width:900px){.scroll-top-btn{bottom:110px}}


/* ═══ مشغّل التلاوة ══════════════════════════════════════════════════ */
.mq-player{
  position:fixed;inset-inline:12px;bottom:12px;z-index:120;direction:rtl;
  display:flex;align-items:center;gap:5px;padding:9px 11px;
  background:var(--card);border:1px solid var(--border);border-radius:19px;
  box-shadow:0 20px 46px -24px rgba(9,32,24,.62);
}
.mq-player[hidden]{display:none!important}
.mq-pl-prog{position:absolute;top:0;inset-inline-start:16px;height:2.5px;width:0;border-radius:2px;
  background:linear-gradient(90deg,var(--gold),var(--gold-dark));transition:width .25s linear}
.mq-pl-btn{width:38px;height:38px;flex:0 0 auto;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--border);background:var(--sand);color:var(--ink);cursor:pointer;transition:.16s}
.mq-pl-btn:active{transform:scale(.94)}
.mq-pl-btn::before{content:'';width:17px;height:17px;background:currentColor;
  -webkit-mask-image:var(--m);mask-image:var(--m);
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain}
.mq-pl-main{width:47px;height:47px;border-radius:50%;border:none;color:#fff;
  background:linear-gradient(135deg,var(--green-deep),var(--green-mid));
  box-shadow:0 10px 22px -12px rgba(14,59,46,.95)}
.mq-pl-main::before{width:19px;height:19px}
.mq-pl-sm{width:32px;height:32px;border-radius:10px;background:transparent;color:var(--muted)}
.mq-pl-sm::before{width:15px;height:15px}
.mq-pl-txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:1px;margin-inline-start:3px}
.mq-pl-txt b{font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-pl-txt small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mq-player.is-playing #mq-pl-toggle::before{--m:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PHJlY3QgeD0nNycgeT0nNScgd2lkdGg9JzMuNicgaGVpZ2h0PScxNCcgcng9JzEuMicgZmlsbD0nYmxhY2snLz48cmVjdCB4PScxMy40JyB5PSc1JyB3aWR0aD0nMy42JyBoZWlnaHQ9JzE0JyByeD0nMS4yJyBmaWxsPSdibGFjaycvPjwvc3ZnPg==")}

.mq-pl-loop-on{color:var(--gold-dark);background:var(--gold-pale);border-radius:10px}

/* تكرار الآية — داخل لوحة التلاوة */
.mq-loop-row{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  padding:11px 14px;border:1px solid var(--border);border-radius:14px;background:var(--card);
  color:var(--ink);font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;margin:0 0 14px;transition:.16s}
.mq-loop-row:active{transform:scale(.99)}
.mq-loop-row .mq-sw{width:36px;height:21px;border-radius:99px;background:var(--border);position:relative;flex:0 0 auto;transition:background .18s}
.mq-loop-row .mq-sw::after{content:'';position:absolute;top:2.5px;inset-inline-start:3px;width:16px;height:16px;border-radius:50%;
  background:#fff;box-shadow:0 1px 3px rgba(9,32,24,.28);transition:inset-inline-start .18s}
.mq-loop-row.on{border-color:var(--gold);background:var(--gold-pale)}
.mq-loop-row.on .mq-sw{background:var(--green-mid)}
.mq-loop-row.on .mq-sw::after{inset-inline-start:17px}
body.mq-night .mq-loop-row{background:#1b1710;border-color:#2f2a1d;color:#f2e8d2}
body.mq-night .mq-loop-row.on{background:#26200f;border-color:var(--gold)}
html[data-theme="dark"] .mq-player,html[data-theme="oled"] .mq-player{background:#141c18;border-color:#26332c}
body.mq-night .mq-player{background:#12100a;border-color:#2b2416}
body.mq-night .mq-pl-btn{background:#1b1710;border-color:#2f2a1d;color:#e7dcc4}
body.mq-night .mq-pl-main{background:linear-gradient(135deg,#c9a14a,#a9862f);color:#221a06}
body.mq-night .mq-pl-txt b{color:#f2e8d2}
body.mq-night .mq-pl-txt small{color:#b9ac8e}
body.mq-night .mq-play{background:#1b1710;border-color:#2f2a1d;color:var(--gold)}
body.mq-night .mq-play:hover{background:#26200f;border-color:var(--gold)}
body.mq-player-on main.main{padding-bottom:116px}
@media(max-width:900px){.mq-player{bottom:calc(12px + env(safe-area-inset-bottom,0px))}}

/* ═══ الكلمة بكلمة ══════════════════════════════════════════════════ */
.mq-w{border-radius:7px;cursor:pointer;outline:none;transition:background .15s,box-shadow .15s}
.mq-w:hover,.mq-w:focus-visible{background:var(--gold-pale);box-shadow:0 0 0 3px var(--gold-pale)}
.mq-w:active{background:var(--gold-pale)}
.mq-play{width:34px;height:34px;flex:0 0 auto;display:grid;place-items:center;border-radius:11px;
  border:1px solid var(--border);background:var(--card);color:var(--gold-dark);cursor:pointer;transition:.16s}
.mq-play::before{content:'';width:13px;height:13px;background:currentColor;
  -webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;
  -webkit-mask-size:contain;mask-size:contain;--m:url("data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNCAyNCc+PHBhdGggZD0nTTkgNS4ydjEzLjZMMTkgMTJ6JyBmaWxsPSdibGFjaycvPjwvc3ZnPg==");-webkit-mask-image:var(--m);mask-image:var(--m)}
.mq-play:hover{border-color:var(--gold);background:var(--gold-pale)}
.mq-a.is-playing{background:var(--gold-pale);box-shadow:0 0 0 4px var(--gold-pale);border-radius:10px}
.mq-card.is-playing{border-color:rgba(201,161,74,.6);box-shadow:0 0 0 3px rgba(201,161,74,.15)}
.mq-word{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px 2px}
.mq-word b{font-family:'AmiriQuran','Amiri',serif;font-size:38px;line-height:1.7;color:var(--ink);text-align:center}
.mq-word small{font-size:11px;color:var(--muted)}
.mq-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.mq-stat{background:var(--sand);border:1px solid var(--border);border-radius:14px;padding:11px 8px;text-align:center}
.mq-stat b{display:block;font-size:18px;font-weight:800;color:var(--ink);line-height:1.5}
.mq-stat small{font-size:10.5px;color:var(--muted)}


/* ═══ التلاوة: القارئ + التحميل ══════════════════════════════════════ */
.mq-lbl{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.4px;margin:2px 0 7px}

.mq-rec{padding:10px 8px;border-radius:12px;border:1px solid var(--border);background:var(--card);

.mq-rec:hover{border-color:var(--gold)}
.mq-rec.on{border-color:var(--gold);background:var(--gold-pale);color:var(--gold-dark)}
.mq-audio-box{background:var(--sand);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mq-audio-box b{display:block;font-size:13px;color:var(--ink)}
.mq-audio-box small{font-size:11px;color:var(--muted)}
.mq-acts-3{grid-template-columns:repeat(3,1fr)!important;margin-bottom:12px}

    <section class="mq" id="mq">

          <button class="mq-ico" id="mq-set" aria-label="إعدادات القراءة" title="إعدادات"></button>
        </div>
      </div>

      <!-- الأوضاع -->

        </button>

      <!-- الورد -->

        <span id="mq-wird-txt">ورد اليوم</span>
        <span class="mq-wird-bar"><i id="mq-wird-fill"></i></span>
      </div>

      <!-- استئناف -->
