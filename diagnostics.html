<!-- Z9a: api-client.js يجب أن يُحمَّل قبل الـ script الرئيسي -->
<script src="js/api-client.js"></script>

<script>
/* قائمة الصفحات الأساسية للفحص */
var PAGES = [
  'index.html','prayers.html','qibla.html','hijri.html','taqweem.html',
  'mushaf.html','mushaf-quran.html','tasmee.html','barnamaj.html',
  'adhkar.html','hasn.html','du\'a.html','dua-guide.html','adhkar-categories.html',
  'manasik.html','odhiya.html','arafah.html','ghars.html',
  'ai.html','Quran-radio.HTML','videos.html','playlist.html',
  'settings.html','profile.html','privacy.html','about.html','developer.html',
  'zakat.html','asma.html','badges.html','summary.html','hasad.html'
];

/* الموارد الحرجة */
var ASSETS = [
  'css/style.css','css/premium-ui.css','sw.js','manifest.json',
  'js/app.js','js/storage.js','js/core/state-manager.js','js/calendar.js',
  'icons/icon-192.svg'
];

var results = {};

function setProgress(pct){
  var p = document.getElementById('progress');
  p.style.display = 'block';
  p.querySelector('span').style.width = pct + '%';
}

async function checkUrl(url){
  try{
    var res = await fetch(url, {method:'GET', cache:'no-store'});
    var ct = res.headers.get('content-type') || '';
    return { url:url, status:res.status, ok:res.ok, ct:ct };
  }catch(e){
    return { url:url, status:0, ok:false, error:String(e) };
  }
}

async function runFullAudit(){
  var btn = document.getElementById('run-btn');
  btn.disabled = true; btn.textContent = '⏳ جارٍ الفحص...';
  document.getElementById('results').innerHTML = '';
  results = { pages:[], assets:[], sw:null, storage:null, errors:[] };

  var total = PAGES.length + ASSETS.length;
  var done = 0;

  /* 1. فحص الصفحات */
  for(var i=0;i<PAGES.length;i++){
    var r = await checkUrl(PAGES[i]);
    /* لو رجّع HTML بدل اللي متوقّع = تمام للصفحات */
    r.healthy = r.ok && r.status === 200;
    results.pages.push(r);
    done++; setProgress(Math.round(done/total*100));
  }

  /* 2. فحص الموارد */
  for(var j=0;j<ASSETS.length;j++){
    var a = await checkUrl(ASSETS[j]);
    /* تأكد إن JS/CSS رجّع نوع صح مش HTML (مشكلة api.js الشهيرة) */
    var expectJs = /\.js$/.test(ASSETS[j]);
    var expectCss = /\.css$/.test(ASSETS[j]);
    a.healthy = a.ok;
    if(a.ok && expectJs && a.ct.indexOf('html') !== -1){
      a.healthy = false; a.warn = 'رجّع HTML بدل JS!';
    }
    if(a.ok && expectCss && a.ct.indexOf('html') !== -1){
      a.healthy = false; a.warn = 'رجّع HTML بدل CSS!';
    }
    results.assets.push(a);
    done++; setProgress(Math.round(done/total*100));
  }

  /* 3. Service Worker */
  if('serviceWorker' in navigator){
    var regs = await navigator.serviceWorker.getRegistrations();
    results.sw = { count:regs.length, active: regs.some(function(r){return r.active;}) };
  } else {
    results.sw = { count:0, active:false, unsupported:true };
  }

  /* 4. Storage */
  try{
    var keys = Object.keys(localStorage);
    var size = 0;
    keys.forEach(function(k){ size += (localStorage.getItem(k)||'').length; });
    results.storage = { keys:keys.length, sizeKB:Math.round(size/1024) };
  }catch(e){ results.storage = { error:String(e) }; }

  /* 5. أخطاء مسجّلة من الـ overlay */
  results.errors = (window.__zadErrors || []).concat(
    (window.ZadDiag && window.ZadDiag.getErrors) ? window.ZadDiag.getErrors() : []
  );

  /* 6. Button Scanner — يفحص أزرار هذه الصفحة (الدالة موجودة؟) */
  results.buttons = scanButtons();

  /* 7. Network Monitor — نداءات fetch الفاشلة المسجّلة */
  results.network = (window.__zadNet || []).slice();

  /* 8. Performance */
  results.perf = collectPerf();

  renderResults();
  btn.disabled = false; btn.textContent = '🔄 إعادة الفحص';
  document.getElementById('progress').style.display = 'none';
}

/* يفحص كل زر/رابط فيه onclick — هل الدالة المُستدعاة موجودة فعلاً؟ */
function scanButtons(){
  var out = [];
  var els = document.querySelectorAll('[onclick]');
  els.forEach(function(el){
    var code = el.getAttribute('onclick') || '';
    /* استخرج اسم الدالة الأولى */
    var m = code.match(/([a-zA-Z_$][\w$]*)\s*\(/);
    if(!m) return;
    var fn = m[1];
    /* تجاهل كلمات JS عادية */
    if(['if','for','while','return','this','document','window','location','alert','confirm'].indexOf(fn) !== -1) return;
    var exists = typeof window[fn] === 'function';
    out.push({
      label: (el.textContent||'').trim().slice(0,30) || el.getAttribute('aria-label') || fn,
      fn: fn, ok: exists
    });
  });
  return out;
}

/* يقيس الأداء من Performance API */
function collectPerf(){
  try{
    var nav = performance.getEntriesByType('navigation')[0];
    var loadMs = nav ? Math.round(nav.loadEventEnd - nav.startTime) : 0;
    var domNodes = document.getElementsByTagName('*').length;
    var res = performance.getEntriesByType('resource');
    var slow = res.filter(function(r){ return r.duration > 1000; }).length;
    return { loadMs: loadMs, domNodes: domNodes, resources: res.length, slow: slow };
  }catch(e){ return { error: String(e) }; }
}

function renderResults(){
  var pagesBad = results.pages.filter(function(p){return !p.healthy;});
  var assetsBad = results.assets.filter(function(a){return !a.healthy;});
  var jsErrs = results.errors.filter(function(e){return e.type==='js'||e.type==='promise';});

  /* حساب السكور */
  var totalChecks = results.pages.length + results.assets.length;
  var passed = (results.pages.length - pagesBad.length) + (results.assets.length - assetsBad.length);
  var score = Math.round(passed/totalChecks*100);
  var scoreClass = score >= 90 ? 'good' : (score >= 70 ? 'warn' : 'bad');

  var html = '<div class="diag-score '+scoreClass+'">'+score+'/100</div>' +
    '<p style="text-align:center;color:var(--muted);margin-bottom:20px">' +
    passed+' نجح · '+(pagesBad.length+assetsBad.length)+' مشكلة · '+jsErrs.length+' خطأ JS</p>';

  /* الموارد الحرجة (الأهم) */
  html += sectionHtml('📦 الموارد الحرجة', results.assets.map(function(a){
    var st = a.healthy ? 'ok' : 'err';
    var label = a.healthy ? '✅ '+a.status : '❌ '+(a.warn||a.status||'فشل');
    return rowHtml(a.url, label, st);
  }), assetsBad.length);

  /* الصفحات */
  html += sectionHtml('📄 الصفحات ('+results.pages.length+')', results.pages.map(function(p){
    var st = p.healthy ? 'ok' : 'err';
    return rowHtml(p.url, p.healthy ? '✅ '+p.status : '❌ '+(p.status||'فشل'), st);
  }), pagesBad.length);

  /* Service Worker */
  var swOk = results.sw && results.sw.active;
  html += '<div class="diag-section"><h2>⚙️ Service Worker '+
    '<span class="diag-badge '+(swOk?'ok':'warn')+'">'+(swOk?'نشط':'غير نشط')+'</span></h2>' +
    rowHtml('عدد التسجيلات', String(results.sw.count), results.sw.count===1?'ok':'warn') +
    rowHtml('نشط', swOk?'نعم':'لا', swOk?'ok':'warn') + '</div>';

  /* Storage */
  html += '<div class="diag-section"><h2>💾 التخزين المحلي</h2>' +
    rowHtml('عدد المفاتيح', String(results.storage.keys||0), 'ok') +
    rowHtml('الحجم', (results.storage.sizeKB||0)+' KB', results.storage.sizeKB>4000?'warn':'ok') +
    '</div>';

  /* الأزرار (Button Scanner) */
  var btnsBad = (results.buttons||[]).filter(function(b){return !b.ok;});
  if(results.buttons && results.buttons.length){
    html += sectionHtml('🔘 أزرار هذه الصفحة ('+results.buttons.length+')',
      results.buttons.map(function(b){
        return rowHtml(b.label+' → '+b.fn+'()', b.ok?'✅ موجودة':'❌ دالة مفقودة', b.ok?'ok':'err');
      }), btnsBad.length);
  }

  /* الشبكة (Network Monitor) */
  if(results.network && results.network.length){
    html += sectionHtml('🌐 نداءات فشلت', results.network.map(function(n){
      return rowHtml(n.url, (n.status||'فشل')+' · '+n.ms+'ms', 'err');
    }), results.network.length);
  } else {
    html += '<div class="diag-section"><h2>🌐 الشبكة '+
      '<span class="diag-badge ok">سليم</span></h2>'+
      '<div class="diag-empty">✅ لا توجد نداءات فاشلة مسجّلة</div></div>';
  }

  /* الأداء (Performance) */
  if(results.perf && !results.perf.error){
    var p = results.perf;
    html += '<div class="diag-section"><h2>⚡ الأداء</h2>' +
      rowHtml('زمن التحميل', p.loadMs+' ms', p.loadMs>3000?'warn':'ok') +
      rowHtml('عناصر DOM', String(p.domNodes), p.domNodes>1500?'warn':'ok') +
      rowHtml('موارد محمّلة', String(p.resources), 'ok') +
      rowHtml('موارد بطيئة (>1s)', String(p.slow), p.slow>0?'warn':'ok') +
      '</div>';
  }

  /* أخطاء JS */
  if(jsErrs.length){
    html += sectionHtml('🔴 أخطاء JavaScript', jsErrs.map(function(e){
      return rowHtml((e.file||'')+(e.line?':'+e.line:''), e.msg, 'err');
    }), jsErrs.length);
  } else {
    html += '<div class="diag-section"><h2>🔴 أخطاء JavaScript '+
      '<span class="diag-badge ok">نظيف</span></h2>'+
      '<div class="diag-empty">✅ لا توجد أخطاء JS مسجّلة</div></div>';
  }

  document.getElementById('results').innerHTML = html;
}

function sectionHtml(title, rows, badCount){
  var cls = badCount===0 ? 'ok' : (badCount<=2 ? 'warn' : 'err');
  var txt = badCount===0 ? 'سليم' : badCount+' مشكلة';
  return '<div class="diag-section"><h2>'+title+
    '<span class="diag-badge '+cls+'">'+txt+'</span></h2>'+rows.join('')+'</div>';
}

function rowHtml(name, status, cls){
  return '<div class="diag-row"><span class="name">'+esc(name)+'</span>'+
    '<span class="status '+cls+'">'+esc(status)+'</span></div>';
}

function esc(s){
  return String(s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ════════════════════════════════════════════════════════
   Z9a — API Health Card
   يستخدم window.ZadAPI (js/api-client.js) لفحص الاتصال.
   • health()  → GET /health/ready
   • index()   → GET /api/v1
   يُثبت أن api-client.js يعمل من السياق الفعلي للـ PWA.
   ════════════════════════════════════════════════════════ */
(function () {

  function renderApiCard(healthRes, apiRes) {
    var healthOk = healthRes.ok && healthRes.data && healthRes.data.status === 'ok';
    var dbOk     = healthRes.data && healthRes.data.db === 'ok';
    var apiOk    = apiRes.ok;

    var cls = (healthOk && dbOk && apiOk) ? 'ok' : (!healthOk ? 'err' : 'warn');
    var lbl = (healthOk && dbOk && apiOk) ? 'متاح' : (!healthOk ? 'تعذّر الوصول' : 'جزئي');

    var rows = '';

    /* /health/ready */
    var hSt  = healthRes.ok ? 'ok' : 'err';
    var hVal = healthRes.ok
      ? '✅ ' + healthRes.status + ' · db:' + (dbOk ? 'ok' : '⚠️ ' + (healthRes.data && healthRes.data.db || '?'))
      : '❌ ' + (healthRes.error || healthRes.status || 'فشل');
    rows += rowHtml('/health/ready — reachable', hVal, hSt);

    /* /api/v1 */
    var aSt  = apiRes.ok ? 'ok' : 'err';
    var aVal = apiRes.ok
      ? '✅ ' + apiRes.status + ' · v' + (apiRes.data && apiRes.data.version || '?') + ' · sprint:' + (apiRes.data && apiRes.data.sprint || '?')
      : '❌ ' + (apiRes.error || apiRes.status || 'فشل');
    rows += rowHtml('/api/v1 — reachable', aVal, aSt);

    /* SW bypass — expected, needs manual Cache Storage check */
    var swCls = (healthRes.ok || apiRes.ok) ? 'warn' : 'warn';
    rows += rowHtml(
      'SW bypass — configured in sw.js',
      '⚠️ تحقق يدوي مطلوب: Cache Storage يجب ألا يحتوي /api/ أو /health/',
      swCls
    );

    if (apiRes.data && apiRes.data.version) {
      rows += rowHtml('Sprint', esc(apiRes.data.sprint || '—'), 'ok');
    }

    /* ZadAPI module */
    var zadApiOk = typeof window.ZadAPI === 'object' && typeof window.ZadAPI.health === 'function';
    rows += rowHtml('window.ZadAPI loaded', zadApiOk ? '✅ api-client.js يعمل' : '❌ لم يُحمَّل', zadApiOk ? 'ok' : 'err');

    var card = '<div class="diag-section" id="api-health-card">' +
      '<h2>🔌 API Connectivity (Z9a) <span class="diag-badge ' + cls + '">' + lbl + '</span></h2>' +
      rows + '</div>';

    var existing = document.getElementById('api-health-card');
    if (existing) existing.remove();

    var resultsEl = document.getElementById('results');
    if (resultsEl) resultsEl.insertAdjacentHTML('afterbegin', card);
  }

  function runApiHealthCheck() {
    /* التأكد من تحميل ZadAPI أولاً */
    if (typeof window.ZadAPI !== 'object' || typeof window.ZadAPI.health !== 'function') {
      var resultsEl = document.getElementById('results');
      if (resultsEl && !document.getElementById('api-health-card')) {
        resultsEl.insertAdjacentHTML('afterbegin',
          '<div class="diag-section" id="api-health-card">' +
          '<h2>🔌 API Connectivity (Z9a) <span class="diag-badge err">خطأ</span></h2>' +
          '<div class="diag-empty">❌ window.ZadAPI غير موجود — تأكد من تحميل js/api-client.js</div>' +
          '</div>');
      }
      return;
    }

    /* placeholder أثناء الفحص */
    var resultsEl = document.getElementById('results');
    if (resultsEl && !document.getElementById('api-health-card')) {
      resultsEl.insertAdjacentHTML('afterbegin',
        '<div class="diag-section" id="api-health-card">' +
        '<h2>🔌 API Connectivity (Z9a) <span class="diag-badge warn">جارٍ الفحص…</span></h2>' +
        '<div class="diag-empty">⏳ يستدعي window.ZadAPI…</div></div>');
    }

    /* استخدام ZadAPI مباشرة — هذا ما يُثبت أن api-client.js يعمل */
    Promise.all([window.ZadAPI.health(), window.ZadAPI.index()])
      .then(function (r) { renderApiCard(r[0], r[1]); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runApiHealthCheck);
  } else {
    runApiHealthCheck();
  }

  window.runApiHealthCheck = runApiHealthCheck;
})();

/* ════════════════════════════════════════════════════════
   Z9b — Auth Status Card
   يستخدم window.ZadAPI.auth للتحقق من الجلسة.
   • لا credentials مخزّنة
   • لا localStorage/sessionStorage
   • لا login form
   • console helpers فقط للاختبار اليدوي
   ════════════════════════════════════════════════════════ */
(function () {

  /* ── render Auth card ── */
  function renderAuthCard(meRes) {
    var authed  = meRes.ok && meRes.data && meRes.data.userId;
    var cls     = authed ? 'ok' : (meRes.status === 401 ? 'warn' : 'err');
    var lbl     = authed ? 'مصادق ✅' : (meRes.status === 401 ? 'NO_SESSION' : 'خطأ');

    var rows = '';

    if (authed) {
      /* نعرض userId فقط — لا email، لا بيانات حساسة */
      rows += rowHtml('Session', '✅ نشطة', 'ok');
      rows += rowHtml('userId', esc(String(meRes.data.userId).slice(0, 8) + '…'), 'ok');
      if (meRes.data.sessionExpiresAt) {
        rows += rowHtml('Expires', esc(meRes.data.sessionExpiresAt), 'ok');
      }
    } else if (meRes.status === 401) {
      rows += rowHtml('Session', 'لا توجد جلسة نشطة', 'warn');
      rows += rowHtml('hint', 'استخدم window.runAuthE2E(email, password) من الـ Console', 'warn');
    } else {
      rows += rowHtml('Error', esc(meRes.error || ('HTTP ' + meRes.status)), 'err');
    }

    rows += rowHtml(
      'window.ZadAPI.auth',
      (typeof window.ZadAPI === 'object' && typeof window.ZadAPI.auth === 'object')
        ? '✅ login / me / logout جاهزة'
        : '❌ لم تُحمَّل',
      (typeof window.ZadAPI === 'object' && typeof window.ZadAPI.auth === 'object') ? 'ok' : 'err'
    );

    var card = '<div class="diag-section" id="auth-status-card">' +
      '<h2>🔐 Auth Status (Z9b) <span class="diag-badge ' + cls + '">' + lbl + '</span></h2>' +
      rows + '</div>';

    var existing = document.getElementById('auth-status-card');
    if (existing) existing.remove();

    var apiCard = document.getElementById('api-health-card');
    if (apiCard) {
      apiCard.insertAdjacentHTML('afterend', card);
    } else {
      var resultsEl = document.getElementById('results');
      if (resultsEl) resultsEl.insertAdjacentHTML('afterbegin', card);
    }
  }

  /* ── Auto check on load ── */
  function runAuthStatusCheck() {
    if (typeof window.ZadAPI !== 'object' || typeof window.ZadAPI.auth !== 'object') {
      var r = document.getElementById('results');
      if (r && !document.getElementById('auth-status-card')) {
        var ph = document.createElement('div');
        ph.id = 'auth-status-card';
        ph.className = 'diag-section';
        ph.innerHTML = '<h2>🔐 Auth Status (Z9b) <span class="diag-badge err">خطأ</span></h2>' +
          '<div class="diag-empty">❌ window.ZadAPI.auth غير موجود</div>';
        var apiCard = document.getElementById('api-health-card');
        if (apiCard) apiCard.insertAdjacentHTML('afterend', ph.outerHTML);
        else r.insertAdjacentHTML('afterbegin', ph.outerHTML);
      }
      return Promise.resolve();
    }

    /* placeholder */
    var existing = document.getElementById('auth-status-card');
    if (!existing) {
      var apiCard = document.getElementById('api-health-card');
      var ph2 = '<div class="diag-section" id="auth-status-card">' +
        '<h2>🔐 Auth Status (Z9b) <span class="diag-badge warn">جارٍ الفحص…</span></h2>' +
        '<div class="diag-empty">⏳ يستدعي ZadAPI.auth.me()…</div></div>';
      if (apiCard) apiCard.insertAdjacentHTML('afterend', ph2);
      else {
        var r2 = document.getElementById('results');
        if (r2) r2.insertAdjacentHTML('afterbegin', ph2);
      }
    }

    return window.ZadAPI.auth.me().then(function (res) {
      renderAuthCard(res);
      return res;
    });
  }

  /* ── Console Helpers (لا تُخزَّن credentials) ── */

  /**
   * window.runAuthE2E(email, password)
   * يشغّل login → me → يطبع النتائج
   * بيانات الاختبار تُمرَّر مباشرة من الـ console، لا تُحفظ في أي مكان
   */
  window.runAuthE2E = function (email, password) {
    console.group('[ZAD Z9B] Auth E2E Test');
    return window.ZadAPI.auth.login(email, password)
      .then(function (loginRes) {
        console.log('login →', loginRes.status, loginRes.data || loginRes.error);
        return window.ZadAPI.auth.me();
      })
      .then(function (meRes) {
        console.log('me    →', meRes.status, meRes.data || meRes.error);
        renderAuthCard(meRes);
        console.groupEnd();
        return meRes;
      })
      .catch(function (err) {
        console.error('E2E error:', err);
        console.groupEnd();
      });
  };

  /**
   * window.runAuthLogout()
   * يشغّل logout → me (يجب أن يرجع 401)
   */
  window.runAuthLogout = function () {
    console.group('[ZAD Z9B] Logout Test');
    return window.ZadAPI.auth.logout()
      .then(function (logoutRes) {
        console.log('logout →', logoutRes.status, logoutRes.data || logoutRes.error);
        return window.ZadAPI.auth.me();
      })
      .then(function (meRes) {
        console.log('me after logout →', meRes.status, meRes.data || meRes.error);
        renderAuthCard(meRes);
        console.groupEnd();
        return meRes;
      })
      .catch(function (err) {
        console.error('Logout error:', err);
        console.groupEnd();
      });
  };

  /**
   * window.runAuthStatusCheck()
   * يعيد فحص الجلسة الحالية ويحدّث الكارت
   */
  window.runAuthStatusCheck = runAuthStatusCheck;

  /* ── تشغيل تلقائي عند التحميل ── */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', runAuthStatusCheck);
  } else {
    runAuthStatusCheck();
  }

})();

  /* ═══════════════════════════════════════════════════════════════════════
     Z9c — Worship Sync
     ═══════════════════════════════════════════════════════════════════════ */

  (function initZ9cCard() {
    var ph = document.getElementById('z9c-card');
    if (!ph) return;

    /* skeleton */
    ph.innerHTML =
      '<h2>\ud83d\udd4c Worship Sync (Z9c) <span class="diag-badge warn">\u062c\u0627\u0631\u064d \u0627\u0644\u0641\u062d\u0635\u2026</span></h2>' +
      '<table id="z9c-table"></table>';

    var tbl = document.getElementById('z9c-table');

    function row(k, v, cls) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + k + '</td><td class="' + (cls || '') + '">' + v + '</td>';
      tbl.appendChild(tr);
    }

    function setHeader(lbl, cls) {
      ph.querySelector('h2').innerHTML =
        '🕌 Worship Sync (Z9c) <span class="diag-badge ' + cls + '">' + lbl + '</span>';
    }

    /* فحص ZadAPI.worship */
    if (window.ZadAPI && window.ZadAPI.worship &&
        typeof window.ZadAPI.worship.push === 'function' &&
        typeof window.ZadAPI.worship.list === 'function') {
      row('window.ZadAPI.worship', '\u2705 push / list \u062c\u0627\u0647\u0632\u062a\u0627\u0646', 'ok');
    } else {
      row('window.ZadAPI.worship', '\u274c \u063a\u064a\u0631 \u0645\u0648\u062c\u0648\u062f \u2014 \u062a\u062d\u0642\u0642 \u0645\u0646 api-client.js', 'err');
      setHeader('\u062e\u0637\u0623', 'err');
      return;
    }

    row('Preview', '<code>runWorshipPayloadPreview()</code>', 'hint');
    row('Test', '<code>runWorshipSyncTest()</code>', 'hint');

    /* فحص session */
    if (!window.ZadAPI || !window.ZadAPI.auth) {
      row('Session', '\u274c ZadAPI.auth \u063a\u064a\u0631 \u0645\u0648\u062c\u0648\u062f', 'err');
      setHeader('\u062e\u0637\u0623', 'err');
      return;
    }

    window.ZadAPI.auth.me().then(function (res) {
      if (res.ok) {
        row('Session', '\u2705 \u0645\u0635\u0627\u062f\u0642 (userId: ' + res.data.userId + ')', 'ok');
        row('Push Ready', '\u2705 \u0646\u0639\u0645', 'ok');
        setHeader('\u062c\u0627\u0647\u0632', 'ok');
      } else {
        row('Session', '\u26a0\ufe0f \u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644 \u0645\u0637\u0644\u0648\u0628 \u2014 <code>runAuthE2E()</code>', 'warn');
        row('Push Ready', '\u26a0\ufe0f \u064a\u062a\u0637\u0644\u0628 session', 'warn');
        setHeader('\u062a\u0633\u062c\u064a\u0644 \u0645\u0637\u0644\u0648\u0628', 'warn');
      }
    }).catch(function (err) {
      row('Session', '\u274c \u062e\u0637\u0623: ' + err.message, 'err');
      setHeader('\u062e\u0637\u0623', 'err');
    });
  })();

  /* ── Z9c helpers ──────────────────────────────────────────────────────── */

  /* _z9cBuildPayload — مشترك، read-only على localStorage */
  function _z9cBuildPayload() {
    var raw = localStorage.getItem('zad_v2');
    var zad;
    try { zad = raw ? JSON.parse(raw) : {}; }
    catch (e) { throw new Error('zad_v2 parse error: ' + e.message); }

    var now     = new Date();
    var pad     = function (n) { return n < 10 ? '0' + n : String(n); };
    var logDate = now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate());

    var payload = {
      worship:       (zad.worship || {}),
      streak:        (zad.streak  || 0),
      takbeer_total: (zad.takbeer && zad.takbeer.total ? zad.takbeer.total : 0),
      history_today: (zad.history && zad.history[logDate] ? zad.history[logDate] : null)
    };

    var iKey = zad._uuid ? (logDate + '-' + zad._uuid) : undefined;
    return { logDate: logDate, payload: payload, iKey: iKey, snapRaw: raw };
  }

  /**
   * runWorshipPayloadPreview()
   * يعرض ما سيُرسَل بدون أي طلب شبكي
   */
  window.runWorshipPayloadPreview = function () {
    console.log('[ZAD Z9C] Payload Preview (no network call)');
    try {
      var built = _z9cBuildPayload();
      console.log('log_date:', built.logDate);
      console.log('payload:', built.payload);
      if (built.iKey) console.log('idempotency_key:', built.iKey);
      else            console.log('idempotency_key: (none \u2014 zad._uuid absent)');
      return built;
    } catch (e) {
      console.error(e.message);
      return null;
    }
  };

  /**
   * runWorshipSyncTest()
   * 1. auth.me  — يتأكد من session
   * 2. snapshot localStorage قبل
   * 3. worship.push
   * 4. equality check بعد (no-write guarantee)
   */
  window.runWorshipSyncTest = function () {
    console.log('[ZAD Z9C] Worship Sync Test');

    return window.ZadAPI.auth.me().then(function (meRes) {
      if (!meRes.ok) {
        console.warn('auth.me \u2192', meRes.status, meRes.data);
        console.warn('\u26a0\ufe0f \u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644 \u0645\u0637\u0644\u0648\u0628 \u2014 \u0634\u063a\u0651\u0644 runAuthE2E \u0623\u0648\u0644\u0627\u064b');
        return meRes;
      }
      console.log('auth.me \u2192 200  userId:', meRes.data.userId);

      var snapBefore = localStorage.getItem('zad_v2');

      var built;
      try { built = _z9cBuildPayload(); }
      catch (e) { console.error(e.message); return Promise.reject(e); }

      console.log('log_date:', built.logDate);
      console.log('payload:', built.payload);
      if (built.iKey) console.log('idempotency_key:', built.iKey);

      return window.ZadAPI.worship.push(built.logDate, built.payload, built.iKey)
        .then(function (pushRes) {
          var snapAfter = localStorage.getItem('zad_v2');
          if (snapBefore === snapAfter) {
            console.log('\u2705 localStorage \u0644\u0645 \u064a\u062a\u063a\u064a\u0651\u0631 (read-only \u0645\u0624\u0643\u0651\u062f)');
          } else {
            console.error('\u274c localStorage \u062a\u063a\u064a\u0651\u0631 \u2014 \u062e\u0631\u0642 \u0642\u0627\u0639\u062f\u0629 read-only!');
          }
          if (pushRes.ok) {
            console.log('push \u2192', pushRes.status, pushRes.data);
          } else {
            console.warn('push \u2192', pushRes.status, pushRes.data);
          }
          return pushRes;
        });
    }).catch(function (err) {
      console.error('runWorshipSyncTest error:', err);
      throw err;
    });
  };

  /* ── end Z9c ─────────────────────────────────────────────────────────── */

  /* Z9d — Readback + Repeat Sync Proof */

  (function initZ9dCard() {
    var ph = document.getElementById('z9d-card');
    if (!ph) return;

    ph.innerHTML =
      '<h2>📋 Sync Readback (Z9d) <span class="diag-badge warn">جارن…</span></h2>' +
      '<table id="z9d-table"></table>' +
      '<div id="z9d-actions" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"></div>' +
      '<div id="z9d-result" style="margin-top:8px;font-family:monospace;font-size:12px;white-space:pre-wrap;max-height:220px;overflow:auto;border:1px solid var(--b);border-radius:6px;padding:8px;display:none"></div>';

    var tbl = document.getElementById('z9d-table');
    var actions = document.getElementById('z9d-actions');
    var result  = document.getElementById('z9d-result');

    function row(k, v, cls) {
      var tr = document.createElement('tr');
      tr.innerHTML = '<td>' + k + '</td><td class="' + (cls||'') + '">' + v + '</td>';
      tbl.appendChild(tr);
    }
    function setHeader(lbl, cls) {
      ph.querySelector('h2').innerHTML =
        '📋 Sync Readback (Z9d) <span class="diag-badge ' + cls + '">' + lbl + '</span>';
    }
    function showResult(text) {
      result.textContent = text;
      result.style.display = 'block';
    }
    function btn(label, fn) {
      var b = document.createElement('button');
      b.textContent = label;
      b.style.cssText = 'padding:4px 12px;font-size:12px;border-radius:6px;border:1px solid var(--b);background:var(--bg2);cursor:pointer;color:var(--p)';
      b.onclick = function () {
        b.disabled = true;
        showResult('جاري…');
        fn().finally(function () { b.disabled = false; });
      };
      actions.appendChild(b);
    }

    if (!window.ZadAPI || !window.ZadAPI.auth) {
      row('Status', '❌ ZadAPI غير موجود', 'err');
      setHeader('خطأ', 'err'); return;
    }

    window.ZadAPI.auth.me().then(function (res) {
      if (!res.ok) {
        row('Session', '⚠️ تسجيل دخول مطلوب — <code>runAuthE2E()</code>', 'warn');
        setHeader('تسجيل مطلوب', 'warn'); return;
      }
      row('Session', '✅ مصادق (userId: ' + res.data.userId + ')', 'ok');
      row('Readback', '<code>runWorshipReadback()</code>', 'hint');
      row('Repeat sync', '<code>runWorshipRepeatSync()</code>', 'hint');
      setHeader('جاهز', 'ok');

      btn('📋 List logs', function () {
        return window.runWorshipReadback().then(function (r) {
          if (r && r.ok) {
            var logs = (r.data && r.data.data) ? r.data.data : [];
            var meta = (r.data && r.data.meta) ? r.data.meta : {};
            showResult(
              'count: ' + (meta.count !== undefined ? meta.count : logs.length) + '\n' +
              'has_more: ' + (meta.has_more || false) + '\n\n' +
              logs.map(function (l, i) {
                return '#' + (i+1) + '  ' + (l.log_date ? l.log_date.slice(0,10) : '?') +
                  '  seq:' + l.server_seq +
                  '  streak:' + (l.payload && l.payload.streak !== undefined ? l.payload.streak : '?') +
                  '\n    updated: ' + (l.updated_at ? l.updated_at.slice(0,19).replace('T',' ') : '?');
              }).join('\n')
            );
          } else { showResult('ERROR: ' + JSON.stringify(r && r.data)); }
        });
      });

      btn('↺ Repeat sync', function () {
        return window.runWorshipRepeatSync().then(function (r) {
          if (r && r.ok) {
            var d = r.data && r.data.data ? r.data.data : r.data;
            showResult(
              'push → 200\n' +
              'id:         ' + (d.id||'?') + '\n' +
              'log_date:   ' + (d.log_date ? d.log_date.slice(0,10) : '?') + '\n' +
              'server_seq: ' + (d.server_seq||'?') + '\n' +
              'updated_at: ' + (d.updated_at ? d.updated_at.slice(0,19).replace('T',' ') : '?') + '\n\n' +
              '✅ upsert مؤكّد — نفس id بسيق جديد'
            );
          } else { showResult('ERROR: ' + JSON.stringify(r && r.data)); }
        });
      });

    }).catch(function (err) {
      row('Session', '❌ ' + err.message, 'err');
      setHeader('خطأ', 'err');
    });
  })();

  window.runWorshipReadback = function () {
    console.log('[ZAD Z9D] Worship Readback');
    return window.ZadAPI.worship.list().then(function (res) {
      if (res.ok) {
        var logs = (res.data && res.data.data) ? res.data.data : [];
        var meta = (res.data && res.data.meta) ? res.data.meta : {};
        console.log('count:', meta.count !== undefined ? meta.count : logs.length);
        console.log('has_more:', meta.has_more || false);
        logs.forEach(function (l, i) {
          console.log('#'+(i+1), l.log_date ? l.log_date.slice(0,10) : '?',
            'seq:'+l.server_seq, l.payload);
        });
      } else { console.warn('list →', res.status, res.data); }
      return res;
    }).catch(function (err) { console.error('runWorshipReadback error:', err); throw err; });
  };

  window.runWorshipRepeatSync = function () {
    console.log('[ZAD Z9D] Repeat Sync Test');
    var snapBefore = localStorage.getItem('zad_v2');
    var built;
    try { built = _z9cBuildPayload(); }
    catch (e) { console.error(e.message); return Promise.reject(e); }
    var repeatKey = built.logDate + '-repeat-' + Date.now();
    console.log('log_date:', built.logDate);
    console.log('idempotency_key (new):', repeatKey);
    return window.ZadAPI.worship.push(built.logDate, built.payload, repeatKey)
      .then(function (res) {
        var snapAfter = localStorage.getItem('zad_v2');
        if (snapBefore === snapAfter) {
          console.log('✅ localStorage لم يتغيّر (read-only مؤكّد)');
        } else {
          console.error('❌ localStorage تغيّر!');
        }
        if (res.ok) {
          var d = res.data && res.data.data ? res.data.data : res.data;
          console.log('push → 200');
          console.log('  id:        ', d.id);
          console.log('  server_seq:', d.server_seq, '(should be > previous)');
          console.log('  updated_at:', d.updated_at);
          console.log('✅ upsert confirmed — no duplicate row');
        } else { console.warn('push →', res.status, res.data); }
        return res;
      }).catch(function (err) { console.error('runWorshipRepeatSync error:', err); throw err; });
  };

  /* end Z9d */
</script>
