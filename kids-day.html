@font-face{font-family:'ThmanyahSans';src:url('fonts/thmanyahsans-Bold.woff2') format('woff2'),url('fonts/thmanyahsans-Bold.otf') format('opentype');font-weight:700;font-display:swap}

h1,h2,h3,.page-title,.brand-name{font-family:'ThmanyahSans','IBM Plex Sans Arabic',sans-serif}

/* ══ هيكل مشترك ══ */
.kx-hero{background:linear-gradient(135deg,#2a2350 0%,#4a3a7a 55%,#8a6a1f 140%);border-radius:24px;padding:24px 22px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 16px 48px -14px rgba(42,35,80,.55)}
.kx-hero::after{content:'🕰️';position:absolute;top:6px;left:16px;font-size:60px;opacity:.16;line-height:1}
.kx-eyebrow{font-size:11px;color:#ffe9a8;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.kx-title{font-size:26px;font-weight:900;margin-bottom:8px}
.kx-sub{font-size:13px;color:rgba(255,255,255,.92);line-height:1.95;max-width:620px}
.kx-sub b{color:#ffe9a8}

.kx-panel{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.kx-panel h3{margin:0 0 10px;font-size:15px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:7px}
.kx-panel p{font-size:12.5px;line-height:1.95;color:var(--muted);margin:0 0 12px}
.kx-panel p:last-child{margin-bottom:0}
.kx-panel b{color:var(--ink)}

.kx-btn{width:100%;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primitive-green-900),var(--primitive-green-700));color:#fff;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px -10px rgba(14,59,46,.6);margin-top:12px;transition:transform .15s,opacity .15s}
.kx-btn:hover:not(:disabled){transform:translateY(-1px)}
.kx-btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.kx-btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--border);box-shadow:none}
.kx-btn.gold{background:linear-gradient(135deg,#7d5f1c,#8a6a1f);color:#fdfaf2}
.kx-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.kx-row .kx-btn{width:auto;flex:1;min-width:118px;margin-top:0}

.kx-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;background:var(--sand);border:1px solid var(--border);border-radius:999px;padding:4px 11px;color:var(--muted)}
.kx-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.kx-fb{display:none;border-radius:13px;padding:11px 14px;font-size:12.5px;font-weight:800;line-height:1.85;text-align:center;margin-top:11px}
.kx-fb.ok{display:block;background:var(--green-pale);color:var(--green-deep);border:1px solid var(--green-soft)}
.kx-fb.no{display:block;background:rgba(192,57,43,.1);color:#c0392b;border:1px solid rgba(192,57,43,.3)}
.kx-fb.warn{display:block;background:rgba(201,161,74,.14);color:#8a6a1f;border:1px solid rgba(201,161,74,.35)}

.kx-end{text-align:center;background:linear-gradient(160deg,var(--card),var(--sand));border:2px solid var(--gold);border-radius:24px;padding:26px 22px;box-shadow:0 18px 50px -20px rgba(201,161,74,.6);animation:kxIn .4s ease both}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kx-end .em{font-size:52px;line-height:1;margin-bottom:8px}
.kx-end .tag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:1px;background:var(--primitive-green-700);color:#ffe9a8;padding:5px 13px;border-radius:999px;margin-bottom:10px}
.kx-end h2{font-size:22px;font-weight:900;color:var(--green-deep);margin:0 0 10px}
html[data-theme="dark"] .kx-end h2,html[data-theme="oled"] .kx-end h2{color:var(--sys-green,var(--green-deep))}
.kx-end p{font-size:14px;line-height:2.1;color:var(--ink);margin:0 auto 12px;max-width:560px}
.kx-end .moral{font-size:12.5px;font-weight:800;color:#8a6a1f;background:rgba(201,161,74,.14);border-radius:13px;padding:11px 14px;max-width:560px;margin:0 auto 16px;line-height:1.9}
html[data-theme="dark"] .kx-end .moral,html[data-theme="oled"] .kx-end .moral{color:#e6c97a}

.kx-foot{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.9;margin:10px 0 26px}

/* ══ رأس لكل صفحة ══ */

.dy-strip{display:flex;gap:3px;margin-bottom:12px;background:var(--sand);border:1.5px solid var(--border);border-radius:14px;padding:5px}
.dy-strip i{flex:1;height:30px;border-radius:7px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .25s}
.dy-bucks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.dy-buck{background:var(--card);border:2px solid var(--border);border-radius:16px;padding:10px 11px;transition:all .2s}
.dy-buck.lit{border-color:var(--gold)}
.dy-buck.zero{border-color:#c0392b;background:rgba(192,57,43,.06)}
.dy-buck .top{display:flex;align-items:center;gap:7px;margin-bottom:7px}
.dy-buck .top .ic{font-size:22px}
.dy-buck .top .nm{flex:1;font-size:12px;font-weight:900;color:var(--ink)}
.dy-buck .top .v{font-size:15px;font-weight:900;color:var(--green-deep)}
.dy-buck .ctl{display:flex;gap:5px}
.dy-buck .ctl button{flex:1;padding:7px 0;border-radius:9px;border:1px solid var(--border);background:var(--sand);color:var(--ink);font-family:inherit;font-size:14px;font-weight:900;cursor:pointer}
.dy-buck .ctl button:hover:not(:disabled){background:var(--green-pale);border-color:var(--green-soft)}
.dy-buck .ctl button:disabled{opacity:.3;cursor:not-allowed}
.dy-left{text-align:center;font-size:12px;font-weight:900;color:var(--muted);margin-bottom:10px}
.dy-left b{color:var(--green-deep);font-size:16px}
.dy-clock{display:flex;justify-content:center;gap:6px;margin-bottom:12px;font-size:11px;color:var(--muted);font-weight:800}
.dy-clock span{background:var(--sand);border:1px solid var(--border);border-radius:8px;padding:3px 8px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function readAll(){ try{ return JSON.parse(localStorage.getItem('zad_v2')||'{}')||{}; }catch(e){ return {}; } }
  function saveAll(o){ try{ if (window.zadPatchState){ window.zadPatchState(o); return; } localStorage.setItem('zad_v2', JSON.stringify(o)); }catch(e){} }
  function addStars(n){
    try{
      var st = JSON.parse(localStorage.getItem('zad_kids_v2')||'{}')||{};
      st.stars = (st.stars||0) + n;
      localStorage.setItem('zad_kids_v2', JSON.stringify(st));
    }catch(e){}
  }
  function pop(em){
    try{
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (window.confetti && !reduce) window.confetti({ particleCount: 130, spread: 76, origin:{ y:.62 } });
    }catch(e){}
  }
  function stage(){ return document.getElementById('dy-stage'); }

  /* ══ ١. البلاطات والأنواع ══════════════════════════════════════ */
  var BUCKETS = [
    { id:'prayer', nm:'صلاة وقرآن', em:'🕌', c:'#1a5d47', day:'🕌' },
    { id:'study',  nm:'دراسة وواجب', em:'📚', c:'#22345a', day:'📚' },
    { id:'play',   nm:'لعب وحركة',   em:'🎮', c:'#8a3a2a', day:'🎮' },
    { id:'family', nm:'أهل وزيارة',  em:'👨‍👩‍👧', c:'#6b4a1a', day:'🏡' }
  ];
  var HOURS = 8;

  var TYPES = [
    { id:'school', em:'🏫', title:'يوم مدرسة', place:'الاثنين',
      intro:'ثماني ساعاتٍ بين الفجر والمغرب، وحقيبةٌ وواجب… وأصدقاء ينتظرون في الحوش.',
      anchors:['الفجر ٥:٠٠','المدرسة ٧:٣٠','الظهر ١٢:٠٠','العصر ٣:٠٠','المغرب ٦:٠٠'],
      morals:{ prayer:'', study:'', play:'', family:'', balanced:'', lost:'' } },
    { id:'friday', em:'🌙', title:'يوم الجمعة', place:'الجمعة',
      intro:'يومٌ مختلف: لا مدرسة، والمسجدُ ينتظر، والأهلُ مجتمعون. أين تصرف الساعات؟',
      anchors:['الفجر ٥:٠٠','الجمعة ١٢:٣٠','العصر ٣:٣٠','المغرب ٦:٠٠'],
      morals:{} }
  ];

  /* ══ ٢. النهايات: أضعفُ حصةٍ تُحكَم، لا المتوسط ═══════════════ */
  var ENDINGS = {
    balanced: { em:'🌞', title:'يومٌ متوازن', body:'ثماني ساعاتٍ قُسِمت بالعدل: لله، وللعلم، وللجسد، وللناس. لم تُهمل شيئًا، ولم تُفرِط في شيء.', moral:'اليومُ المتوازن لا يُنسى — لأنه يشبه الحياة التي تُريدها.' },
    prayer:   { em:'🕌', title:'يومٌ نوراني', body:'أعطيتَ الصلاةَ أكثر ساعاتك، فامتلأ اليومُ سكينة. لكن البقية كانت تنتظر أيضًا — والجسدُ والعلمُ عبادةٌ أخرى.', moral:'العبادةُ لا تُلغي الحياة، بل تُنظّمها.' },
    study:    { em:'📚', title:'يومُ الطالب', body:'رأسك في الكتاب حتى المغرب. تعلّمتَ كثيرًا، ونسيتَ أن تُريح عينيك وتلعب قليلًا.', moral:'العلمُ يحتاج عقلًا مرتاحًا — حتى الكتاب يطلب فاصلًا.' },
    play:     { em:'🎮', title:'يومُ المرح', body:'لعبٌ وحركةٌ من الفجر للمغرب. ضحكتَ كثيرًا، لكن الواجبَ بقي في الحقيبة والصلاةَ انتظرت.', moral:'اللعبُ حقٌّ — لكنه ليس اليوم كله.' },
    family:   { em:'🏡', title:'يومُ الأهل', body:'زياراتٌ وجلساتٌ وضحكٌ مع الجدّة. قريبٌ من القلوب، بعيدٌ عن الكتب.', moral:'الجلوسُ مع الكبار عبادةٌ لا تُكتب في الواجب.' },
    lost:     { em:'🍂', title:'يومٌ ضاع', body:'حصةٌ من اليوم بقيت صفرًا — ساعةٌ لم تُعطَ لمن يحتاجها. اليوم لا يعود، ولا يُعوَّض.', moral:'ما لا تُعطيه وقتًا، لا يحدث.' },
    mixed:    { em:'🌤️', title:'يومٌ فيه ظلّ', body:'قريبٌ من التوازن، لكن حصةً واحدة أخذت أكثر مما ينبغي. جرّب أن تُعطي كل شيءٍ حقّه بالضبط.', moral:'التوازنُ ليس نصفين متساويين، بل ألّا يبقى أحدٌ فارغًا.' }
  };

  /* ══ ٣. التخزين ════════════════════════════════════════════════ */
  var prog = (function(){
    var s = readAll(), p = s.kidsDay || {};
    p.endings = p.endings || {};
    return p;
  })();
  function persist(){ var s = readAll(); s.kidsDay = prog; saveAll(s); }
  function discovered(){ return Object.keys(prog.endings).length; }

  /* ══ ٤. الحالة ═════════════════════════════════════════════════ */
  var g = null;  /* { t, alloc } */

  function homeView(){
    g = null;
    var cards = TYPES.map(function(t, i){
      return '<button type="button" class="lr-check" data-type="' + i + '" style="padding:15px 14px">'
        + '<span class="ic" style="font-size:28px">' + t.em + '</span>'
        + '<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:900">' + esc(t.title) + '</span>'
        + '<span style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px">' + esc(t.place) + ' · ' + HOURS + ' ساعات</span></span>'
        + '<span style="font-size:17px;opacity:.45">←</span></button>';
    }).join('');
    stage().innerHTML =
      '<div class="kx-panel">'
      + '<div class="kx-bar"><h3>🕰️ أيامك</h3><span class="kx-pill">' + discovered() + ' / ٧ نهايات</span></div>'
      + '<p>عندك <b>' + HOURS + ' ساعات</b> فقط. لا تتوسّع ولا تتكرّر. وزّعها كما تريد — ثم شاهد يومك.</p>'
      + cards + '</div>'
      + '<div class="kx-panel"><h3>🧭 كيف تُحسب النهاية؟</h3>'
      + '<p>لا بالمتوسط — بل بـ<b>أضعف حصة</b>. يومٌ فيه صلاةٌ كثيرة ولعبٌ صفر ليس يومًا ناجحًا.</p></div>';
    var bs = stage().querySelectorAll('[data-type]');
    for (var i=0;i<bs.length;i++){
      (function(b){ b.addEventListener('click', function(){ start(parseInt(b.getAttribute('data-type'),10)); }); })(bs[i]);
    }
  }

  function start(i){
    var alloc = {};
    for (var k=0;k<BUCKETS.length;k++) alloc[BUCKETS[k].id] = 0;
    g = { t: TYPES[i], alloc: alloc };
    planView();
  }

  function used(){ var n = 0; for (var k in g.alloc){ n += g.alloc[k]; } return n; }

  function planView(){
    var t = g.t, left = HOURS - used();
    var strip = '';
    var seq = [];
    for (var b=0;b<BUCKETS.length;b++){
      for (var n=0;n<g.alloc[BUCKETS[b].id];n++) seq.push(BUCKETS[b]);
    }
    for (var i=0;i<HOURS;i++){
      var bb = seq[i];
      strip += bb
        ? '<i style="background:' + bb.c + ';color:#fff;border-color:' + bb.c + '" title="' + esc(bb.nm) + '">' + bb.em + '</i>'
        : '<i></i>';
    }

    var bucks = BUCKETS.map(function(b){
      var v = g.alloc[b.id];
      return '<div class="dy-buck' + (v > 0 ? ' lit' : '') + (v === 0 ? ' zero' : '') + '">'
        + '<div class="top"><span class="ic">' + b.em + '</span><span class="nm">' + esc(b.nm) + '</span><span class="v" id="dy-v-' + b.id + '">' + v + '</span></div>'
        + '<div class="ctl"><button type="button" data-b="' + b.id + '" data-d="-1"' + (v <= 0 ? ' disabled' : '') + '>−</button>'
        + '<button type="button" data-b="' + b.id + '" data-d="1"' + (left <= 0 ? ' disabled' : '') + '>+</button></div></div>';
    }).join('');

    stage().innerHTML =
      '<div class="kx-panel">'
      + '<div class="kx-bar"><h3>' + t.em + ' ' + esc(t.title) + '</h3><span class="kx-pill">' + esc(t.place) + '</span></div>'
      + '<p>' + esc(t.intro) + '</p>'
      + '<div class="dy-clock">' + t.anchors.map(function(a){ return '<span>' + esc(a) + '</span>'; }).join('') + '</div>'
      + '<div class="dy-strip" id="dy-strip">' + strip + '</div>'
      + '<div class="dy-left">بقيت <b id="dy-left">' + left + '</b> ساعة</div>'
      + '<div class="dy-bucks">' + bucks + '</div>'
      + '<button class="kx-btn gold" id="dy-run"' + (left > 0 ? ' disabled' : '') + '>🌅 شغّل اليوم</button>'
      + '<div class="kx-row"><button class="kx-btn ghost" id="dy-home">↩︎ الأيام</button></div>'
      + '</div>';

    var bs = stage().querySelectorAll('[data-b]');
    for (var j=0;j<bs.length;j++){
      (function(x){ x.addEventListener('click', function(){
        bump(x.getAttribute('data-b'), parseInt(x.getAttribute('data-d'), 10));
      }); })(bs[j]);
    }
    $('dy-run').addEventListener('click', finish);
    $('dy-home').addEventListener('click', homeView);
  }

  function bump(id, d){
    if (!g) return;
    var v = g.alloc[id] + d;
    if (v < 0) v = 0;
    if (d > 0 && used() >= HOURS) return;
    g.alloc[id] = v;
    planView();
  }

  /* ══ ٥. اختيار النهاية ═════════════════════════════════════════ */
  function pickEnding(w){
    var ids = ['prayer','study','play','family'];
    var min = Infinity, minId = ids[0], max = -1, maxId = ids[0], tie = false;
    var vals = ids.map(function(k){ return w[k]; });
    var sorted = vals.slice().sort(function(a,b){ return a-b; });
    if (sorted[0] === sorted[sorted.length-1] && sorted[0] === HOURS / BUCKETS.length) return 'balanced';
    for (var i=0;i<ids.length;i++){
      if (w[ids[i]] < min){ min = w[ids[i]]; minId = ids[i]; }
    }
    if (min === 0) return 'lost';
    for (var j=0;j<ids.length;j++){
      if (w[ids[j]] > max){ max = w[ids[j]]; maxId = ids[j]; tie = false; }
      else if (w[ids[j]] === max){ tie = true; }
    }
    if (tie) return 'mixed';
    return maxId;
  }

  function finish(){
    if (!g || used() < HOURS) return;
    var key = pickEnding(g.alloc);
    if (!prog.endings[key]) { prog.endings[key] = 1; persist(); addStars(3); persist(); }
    else { prog.endings[key] = (prog.endings[key]||0) + 1; persist(); }

    var e = ENDINGS[key];
    var scene = BUCKETS.map(function(b){
      var n = g.alloc[b.id];
      return '<div style="text-align:center;min-width:44px"><div style="font-size:22px;opacity:' + (n === 0 ? '.25' : '1') + '">' + b.em + '</div><div style="font-size:10px;font-weight:900;color:var(--muted)">' + n + 'س</div></div>';
    }).join('');

    stage().innerHTML =
      '<div class="kx-panel"><h3>🌅 ' + esc(g.t.place) + '</h3>'
      + '<div style="display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:10px 0">' + scene + '</div>'
      + '<div class="dy-strip">' + (function(){
          var seq = [];
          for (var b=0;b<BUCKETS.length;b++){ for (var n=0;n<g.alloc[BUCKETS[b].id];n++) seq.push(BUCKETS[b]); }
          var out = '';
          for (var i=0;i<HOURS;i++){
            var bb = seq[i];
            out += bb ? '<i style="background:' + bb.c + ';color:#fff;border-color:' + bb.c + '">' + bb.em + '</i>' : '<i></i>';
          }
          return out;
        })() + '</div></div>'
      + '<div class="kx-end"><div class="em">' + e.em + '</div>'
      + '<div class="tag">' + (prog.endings[key] === 1 ? 'نهاية جديدة' : 'نهاية مألوفة') + '</div>'
      + '<h2>' + esc(e.title) + '</h2><p>' + esc(e.body) + '</p>'
      + '<div class="moral">' + esc(e.moral) + (prog.endings[key] === 1 ? ' · ⭐ +٣ نجوم' : '') + '</div>'
      + '<div class="kx-row" style="justify-content:center">'
      + '<button class="kx-btn" id="dy-again">🔄 أعِد التوزيع</button>'
      + '<button class="kx-btn ghost" id="dy-home2">🕰️ يوم آخر</button></div></div>';
    if (prog.endings[key] === 1) pop();
    $('dy-again').addEventListener('click', function(){ start(TYPES.indexOf(g.t)); });
    $('dy-home2').addEventListener('click', homeView);
  }

  /* ══ ٦. التصدير ══════════════════════════════════════════════ */
  window._dyPure = {
    BUCKETS: BUCKETS, HOURS: HOURS, ENDINGS: ENDINGS,
    pick: pickEnding,
    progress: function(){ return prog; }
  };

  /* ══ الإقلاع ══════════════════════════════════════════════════ */
  var __booted = false;
  function boot(){ if (__booted) return; __booted = true; homeView(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script src="js/a11y-mode.js" defer></script>
</body>
