@font-face{font-family:'ThmanyahSans';src:url('fonts/thmanyahsans-Bold.woff2') format('woff2'),url('fonts/thmanyahsans-Bold.otf') format('opentype');font-weight:700;font-display:swap}

h1,h2,h3,.page-title,.brand-name{font-family:'ThmanyahSans','IBM Plex Sans Arabic',sans-serif}

/* ══ هيكل مشترك ══ */
.kx-hero{background:linear-gradient(135deg,#5a3a12 0%,#8a6a1f 55%,#8a6a1f 140%);border-radius:24px;padding:24px 22px;color:#fff;position:relative;overflow:hidden;margin-bottom:16px;box-shadow:0 16px 48px -14px rgba(90,58,18,.5)}
.kx-hero::after{content:'📐';position:absolute;top:6px;left:16px;font-size:60px;opacity:.16;line-height:1}
.kx-eyebrow{font-size:11px;color:#ffe9a8;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.kx-title{font-size:26px;font-weight:900;margin-bottom:8px}
.kx-sub{font-size:13px;color:rgba(255,255,255,.92);line-height:1.95;max-width:620px}
.kx-sub b{color:#ffe9a8}

.kx-panel{background:var(--card);border:1.5px solid var(--border);border-radius:20px;padding:16px;box-shadow:var(--shadow-sm);margin-bottom:14px}
.kx-panel h3{margin:0 0 10px;font-size:15px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:7px}
.kx-panel p{font-size:12.5px;line-height:1.95;color:var(--muted);margin:0 0 12px}
.kx-panel p:last-child{margin-bottom:0}
.kx-panel b{color:var(--ink)}

.kx-btn{width:100%;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,var(--primitive-green-900),var(--primitive-green-700));color:#fff;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;box-shadow:0 10px 24px -10px rgba(14,59,46,.6);margin-top:12px;transition:transform .15s,opacity .15s}
.kx-btn:hover:not(:disabled){transform:translateY(-1px)}
.kx-btn:disabled{opacity:.42;cursor:not-allowed;box-shadow:none}
.kx-btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--border);box-shadow:none}
.kx-btn.gold{background:linear-gradient(135deg,#7d5f1c,#8a6a1f);color:#fdfaf2}
.kx-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px}
.kx-row .kx-btn{width:auto;flex:1;min-width:118px;margin-top:0}

.kx-pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:900;background:var(--sand);border:1px solid var(--border);border-radius:999px;padding:4px 11px;color:var(--muted)}
.kx-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:12px}

.kx-fb{display:none;border-radius:13px;padding:11px 14px;font-size:12.5px;font-weight:800;line-height:1.85;text-align:center;margin-top:11px}
.kx-fb.ok{display:block;background:var(--green-pale);color:var(--green-deep);border:1px solid var(--green-soft)}
.kx-fb.no{display:block;background:rgba(192,57,43,.1);color:#c0392b;border:1px solid rgba(192,57,43,.3)}
.kx-fb.warn{display:block;background:rgba(201,161,74,.14);color:#8a6a1f;border:1px solid rgba(201,161,74,.35)}

.kx-end{text-align:center;background:linear-gradient(160deg,var(--card),var(--sand));border:2px solid var(--gold);border-radius:24px;padding:26px 22px;box-shadow:0 18px 50px -20px rgba(201,161,74,.6);animation:kxIn .4s ease both}
@keyframes kxIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kx-end .em{font-size:52px;line-height:1;margin-bottom:8px}
.kx-end .tag{display:inline-block;font-size:10.5px;font-weight:900;letter-spacing:1px;background:var(--primitive-green-700);color:#ffe9a8;padding:5px 13px;border-radius:999px;margin-bottom:10px}
.kx-end h2{font-size:22px;font-weight:900;color:var(--green-deep);margin:0 0 10px}
html[data-theme="dark"] .kx-end h2,html[data-theme="oled"] .kx-end h2{color:var(--sys-green,var(--green-deep))}
.kx-end p{font-size:14px;line-height:2.1;color:var(--ink);margin:0 auto 12px;max-width:560px}
.kx-end .moral{font-size:12.5px;font-weight:800;color:#8a6a1f;background:rgba(201,161,74,.14);border-radius:13px;padding:11px 14px;max-width:560px;margin:0 auto 16px;line-height:1.9}
html[data-theme="dark"] .kx-end .moral,html[data-theme="oled"] .kx-end .moral{color:#e6c97a}

.kx-foot{text-align:center;font-size:11.5px;color:var(--muted);line-height:1.9;margin:10px 0 26px}

/* ══ رأس لكل صفحة ══ */

.rc-ratio{display:flex;align-items:center;justify-content:center;gap:14px;background:linear-gradient(135deg,var(--sand),var(--green-pale));border:1.5px solid var(--border);border-radius:16px;padding:13px;margin-bottom:14px}
.rc-ratio .side{text-align:center}
.rc-ratio .n{font-size:24px;font-weight:900;color:var(--green-deep);line-height:1}
.rc-ratio .l{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:4px}
.rc-ratio .arrow{font-size:20px;color:var(--gold);font-weight:900}
.rc-ing{display:grid;gap:9px;margin-bottom:12px}
.rc-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--border);border-radius:15px;padding:10px 12px;transition:border-color .2s}
.rc-row.good{border-color:var(--green-soft);background:var(--green-pale)}
.rc-row.bad{border-color:#c0392b;background:rgba(192,57,43,.07)}
.rc-row .ic{font-size:23px}
.rc-row .nm{flex:1;min-width:0}
.rc-row .nm b{display:block;font-size:12.5px;font-weight:900;color:var(--ink)}
.rc-row .nm small{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}
.rc-step{display:flex;align-items:center;gap:3px;background:var(--sand);border:1px solid var(--border);border-radius:11px;padding:3px}
.rc-step button{width:29px;height:29px;border-radius:8px;border:none;background:var(--card);color:var(--ink);font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;line-height:1}
.rc-step button:hover{background:var(--green-pale)}
.rc-step button:disabled{opacity:.3;cursor:not-allowed}
.rc-step .v{min-width:52px;text-align:center;font-size:13px;font-weight:900;color:var(--ink)}
.rc-tray{background:linear-gradient(180deg,var(--sand),#e9e2d2);border:2px solid #cfc4a8;border-radius:18px;padding:14px 12px 10px;margin-bottom:12px;text-align:center}
html[data-theme="dark"] .rc-tray,html[data-theme="oled"] .rc-tray{background:linear-gradient(180deg,#1a2820,#141f1a);border-color:#2f4a3a}
.rc-tray .guests{display:flex;justify-content:center;flex-wrap:wrap;gap:3px;font-size:19px;line-height:1;margin-bottom:9px}
.rc-tray .dish{font-size:46px;line-height:1;transition:transform .3s}
.rc-tray .cap{font-size:10.5px;font-weight:800;color:var(--muted);margin-top:5px}
.rc-hint{background:rgba(201,161,74,.13);border:1px dashed var(--gold);border-radius:13px;padding:11px 13px;font-size:12px;line-height:1.9;color:var(--ink);margin-top:10px;display:none}
.rc-hint.on{display:block}
.rc-hint b{color:#8a6a1f}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function readAll(){ try{ return JSON.parse(localStorage.getItem('zad_v2')||'{}')||{}; }catch(e){ return {}; } }
  function saveAll(o){ try{ if (window.zadPatchState){ window.zadPatchState(o); return; } localStorage.setItem('zad_v2', JSON.stringify(o)); }catch(e){} }
  function addStars(n){
    try{
      var st = JSON.parse(localStorage.getItem('zad_kids_v2')||'{}')||{};
      st.stars = (st.stars||0) + n;
      localStorage.setItem('zad_kids_v2', JSON.stringify(st));
    }catch(e){}
  }
  function pop(em){
    try{
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (window.confetti && !reduce) window.confetti({ particleCount: 130, spread: 76, origin:{ y:.62 } });
    }catch(e){}
  }
  function stage(){ return document.getElementById('rc-stage'); }

  /* ══ ١. الوصفات ════════════════════════════════════════════════ */
  var DISHES = [
    { id:'bread', em:'🍞', title:'خبزُ العسل', base:4, serve:10,
      intro:'غداءُ العائلة لأربعة. اليوم عندك عشرة ضيوف — والوصفة مكتوبة لأربعة.',
      ing:[ {id:'flour', nm:'دقيق', em:'🌾', per:2, unit:'كوب'},
            {id:'milk',  nm:'لبن',  em:'🥛', per:4, unit:'كوب'},
            {id:'honey', nm:'عسل',  em:'🍯', per:1, unit:'ملعقة'} ] },
    { id:'soup', em:'🍲', title:'شوربةُ الحقل', base:4, serve:10,
      intro:'الشوربةُ التي تُدفئ القرية كلها. نفس القدر لأربعة… وهم عشرة.',
      ing:[ {id:'lentil', nm:'عدس', em:'🫘', per:2, unit:'كوب'},
            {id:'water',  nm:'ماء', em:'💧', per:6, unit:'كوب'},
            {id:'salt',   nm:'ملح', em:'🧂', per:1, unit:'ملعقة'} ] },
    { id:'juice', em:'🥤', title:'شرابُ الليمون', base:4, serve:10,
      intro:'عصيرٌ بارد بعد الظهر. الوصفة لأربعة أكواب… والصفُّ كله عطشان.',
      ing:[ {id:'lemon', nm:'ليمون', em:'🍋', per:2, unit:'حبة'},
            {id:'water', nm:'ماء',   em:'💧', per:8, unit:'كوب'},
            {id:'sugar', nm:'سكر',   em:'🍬', per:2, unit:'ملعقة'} ] }
  ];
  var STEP = 0.5;

  /* ══ ٢. حساب الوصفة (Jacobson: 10 = 4 + 4 + 2) ════════════════ */
  function ratioFor(d){ return d.serve / d.base; }            /* 2.5 */
  function targetOf(d, ing){ return ing.per * ratioFor(d); }  /* 5 · 10 · 2.5 */

  function fmt(v){
    var w = Math.floor(v), f = Math.round((v - w) * 10) / 10;
    if (f === 0) return String(w);
    if (f === 0.5) return w === 0 ? 'نصف' : w + ' ونصف';
    return String(v);
  }

  /* ══ ٣. التخزين ════════════════════════════════════════════════ */
  var prog = (function(){
    var s = readAll(), p = s.kidsRecipe || {};
    p.dishes = p.dishes || {};
    return p;
  })();
  function persist(){ var s = readAll(); s.kidsRecipe = prog; saveAll(s); }
  function solvedCount(){ return Object.keys(prog.dishes).length; }

  /* ══ ٤. الحالة ═════════════════════════════════════════════════ */
  var g = null;   /* { d, vals{}, hint } */

  function homeView(){
    g = null;
    var cards = DISHES.map(function(d, i){
      var done = prog.dishes[d.id];
      return '<button type="button" class="lr-check" data-dish="' + i + '" style="padding:15px 14px">'
        + '<span class="ic" style="font-size:28px">' + d.em + '</span>'
        + '<span style="flex:1;min-width:0"><span style="display:block;font-size:14px;font-weight:900">' + esc(d.title) + '</span>'
        + '<span style="display:block;font-size:11px;font-weight:600;color:var(--muted);margin-top:3px">وصفةُ ' + d.base + ' · والمطلوب ' + d.serve + '</span></span>'
        + (done ? '<span class="kx-pill" style="background:#ffe9a8;color:#2b2108;border-color:#e6c97a">✅ أُتقنت</span>' : '')
        + '<span style="font-size:17px;opacity:.45">←</span></button>';
    }).join('');

    stage().innerHTML =
      '<div class="kx-panel">'
      + '<div class="kx-bar"><h3>📐 المطبخ</h3><span class="kx-pill">' + solvedCount() + ' / ' + DISHES.length + ' أُتقنت</span></div>'
      + '<p>كل وصفةٍ مكتوبة لـ<b>أربعة أشخاص</b>، والضيوف <b>عشرة</b>. لا آلة حاسبة — فقط ضِعفٌ ونصف.</p>'
      + cards + '</div>';
    var bs = stage().querySelectorAll('[data-dish]');
    for (var i=0;i<bs.length;i++){
      (function(b){ b.addEventListener('click', function(){ openDish(parseInt(b.getAttribute('data-dish'),10)); }); })(bs[i]);
    }
  }

  function openDish(i){
    var d = DISHES[i];
    var vals = {};
    for (var k=0;k<d.ing.length;k++) vals[d.ing[k].id] = 0;
    g = { d: d, vals: vals, hint: false };
    cookView();
  }

  function cookView(){
    var d = g.d;
    var ratio = ratioFor(d);
    var rows = d.ing.map(function(ing){
      var v = g.vals[ing.id];
      var max = Math.ceil(targetOf(d, ing) + 3);
      return '<div class="rc-row" data-row="' + ing.id + '">'
        + '<span class="ic">' + ing.em + '</span>'
        + '<span class="nm"><b>' + esc(ing.nm) + '</b><small>لأربعة: ' + fmt(ing.per) + ' ' + ing.unit + '</small></span>'
        + '<span class="rc-step">'
        + '<button type="button" data-inc="' + ing.id + '" data-d="-0.5" aria-label="تقليل"' + (v <= 0 ? ' disabled' : '') + '>−</button>'
        + '<span class="v" id="rc-v-' + ing.id + '">' + fmt(v) + '</span>'
        + '<button type="button" data-inc="' + ing.id + '" data-d="0.5" aria-label="زيادة"' + (v >= max ? ' disabled' : '') + '>+</button>'
        + '</span></div>';
    }).join('');

    var guests = '';
    for (var i=0;i<d.serve;i++) guests += '🧑';

    stage().innerHTML =
      '<div class="kx-panel">'
      + '<div class="kx-bar"><h3>' + d.em + ' ' + esc(d.title) + '</h3><span class="kx-pill">' + d.serve + ' ضيفًا</span></div>'
      + '<p>' + esc(d.intro) + '</p>'
      + '<div class="rc-ratio"><div class="side"><div class="n">' + d.base + '</div><div class="l">الأصل</div></div>'
      + '<div class="arrow">×' + (ratio === Math.floor(ratio) ? ratio : '٢٫٥') + '</div>'
      + '<div class="side"><div class="n">' + d.serve + '</div><div class="l">المطلوب</div></div></div>'
      + '<div class="rc-tray"><div class="guests">' + guests + '</div>'
      + '<div class="dish" id="rc-dish">' + d.em + '</div>'
      + '<div class="cap">املأ المقادير… ثم اخبز.</div></div>'
      + '<div class="rc-ing">' + rows + '</div>'
      + '<button class="kx-btn gold" id="rc-bake">🔥 اخبز الآن</button>'
      + '<div class="kx-row"><button class="kx-btn ghost" id="rc-hint">🤔 كيف أحسب بلا آلة؟</button>'
      + '<button class="kx-btn ghost" id="rc-home">↩︎ الوصفات</button></div>'
      + '<div class="rc-hint' + (g.hint ? ' on' : '') + '" id="rc-hintbox">'
      + '<b>عشرة = أربعة + أربعة + اثنان.</b> أي: الكميةُ + مثلُها + نصفُها. '
      + 'مثال: لأربعةٍ كوبان ← عشرةٌ تأخذ ٢ + ٢ + ١ = <b>٥ أكواب</b>. وهكذا كل مقدار، واحدًا واحدًا.</div>'
      + '</div>';

    var ib = stage().querySelectorAll('[data-inc]');
    for (var i2=0;i2<ib.length;i2++){
      (function(b){ b.addEventListener('click', function(){
        step(b.getAttribute('data-inc'), parseFloat(b.getAttribute('data-d')));
      }); })(ib[i2]);
    }
    $('rc-hint').addEventListener('click', function(){ g.hint = !g.hint; $('rc-hintbox').classList.toggle('on', g.hint); });
    $('rc-bake').addEventListener('click', bake);
    $('rc-home').addEventListener('click', homeView);
  }

  function step(ingId, delta){
    if (!g) return;
    var d = g.d, ing = null;
    for (var i=0;i<d.ing.length;i++){ if (d.ing[i].id === ingId) ing = d.ing[i]; }
    var max = Math.ceil(targetOf(d, ing) + 3);
    var v = Math.round((g.vals[ingId] + delta) * 2) / 2;
    if (v < 0) v = 0;
    if (v > max) v = max;
    g.vals[ingId] = v;
    $('rc-v-' + ingId).textContent = fmt(v);
    var row = stage().querySelector('[data-row="' + ingId + '"]');
    var inc = row.querySelectorAll('[data-inc]');
    for (var j=0;j<inc.length;j++){
      var dd = parseFloat(inc[j].getAttribute('data-d'));
      inc[j].disabled = (dd < 0 && v <= 0) || (dd > 0 && v >= max);
    }
    /* المشهد يتفاعل: الطبق يكبر مع مجموع المقادير */
    var total = 0, want = 0;
    for (var q=0;q<d.ing.length;q++){ total += g.vals[d.ing[q].id]; want += targetOf(d, d.ing[q]); }
    var ratio = want > 0 ? Math.min(1.35, total / want) : 0;
    var dish = $('rc-dish');
    if (dish) dish.style.transform = 'scale(' + (0.72 + ratio * 0.32).toFixed(3) + ')';
    var cap = stage().querySelector('.rc-tray .cap');
    if (cap) cap.textContent = Math.round((total / want) * 100) + '% من الوصفة';
  }

  function bake(){
    if (!g) return;
    var d = g.d, exact = 0, near = 0, total = 0;
    var rows = d.ing.map(function(ing){
      var want = targetOf(d, ing), v = g.vals[ing.id];
      var diff = Math.abs(v - want);
      var cls = diff === 0 ? 'good' : (diff <= 0.5 ? 'bad' : 'bad');
      if (diff === 0) exact++; else if (diff <= 0.5) near++;
      total++;
      return '<div class="rc-row ' + cls + '">'
        + '<span class="ic">' + ing.em + '</span>'
        + '<span class="nm"><b>' + esc(ing.nm) + '</b><small>وضعتَ ' + fmt(v) + ' · المطلوب ' + fmt(want) + ' ' + ing.unit + '</small></span>'
        + '<span style="font-size:18px">' + (diff === 0 ? '✅' : diff <= 0.5 ? '🟡' : '❌') + '</span></div>';
    }).join('');

    var tier = exact === total ? 'perfect' : (exact + near >= total - 1 ? 'near' : 'off');
    var prev = prog.dishes[d.id] || {};
    var first = tier === 'perfect' && !prev.perfect;
    prog.dishes[d.id] = { perfect: !!prev.perfect || tier === 'perfect', tries: (prev.tries||0) + 1 };
    persist();
    if (first) addStars(3);

    var em = tier === 'perfect' ? '🍽️' : tier === 'near' ? '🥄' : '🌾';
    var tag = tier === 'perfect' ? 'وصفةٌ مضبوطة' : tier === 'near' ? 'قريبة… ونصف' : 'اختلطت المقادير';
    var head = tier === 'perfect' ? 'عشرةٌ من أربعة' : tier === 'near' ? 'كادت' : 'المطبخ تعلّم معك';
    var body = tier === 'perfect'
      ? 'ضاعفتَ الكمية ثم أضفتَ نصفها — بلا آلة حاسبة، وبلا خسارةِ حبّة. هذا هو التناسب: لا تحفظ، بل افهم النسبة.'
      : tier === 'near'
        ? 'مقدارٌ أو اثنان ليسا في مكانهما. جرّب أن تحسب الواحد قبل أن تبدأ: المقدار + مثله + نصفه.'
        : 'المقادير لم تتناسب مع عشرة. الطريقة الأسهل: احسب لكل مقدارٍ على حدة (مثله + نصفه)، لا للمجموع كله.';

    stage().innerHTML =
      '<div class="kx-panel"><h3>📋 نتيجة القدر</h3>' + rows + '</div>'
      + '<div class="kx-end"><div class="em">' + em + '</div>'
      + '<div class="tag">' + tag + '</div><h2>' + esc(head) + '</h2>'
      + '<p>' + esc(body) + '</p>'
      + '<div class="moral">الوصفة الأصلية لأربعة. المطلوب عشرة = ضِعفٌ ونصف. كل مقدارٍ يُضرب في ٢٫٥ وحده.</div>'
      + '<div class="kx-row" style="justify-content:center">'
      + '<button class="kx-btn" id="rc-again">🔁 أعِد الوصفة</button>'
      + '<button class="kx-btn ghost" id="rc-home2">📐 وصفة أخرى</button></div></div>';
    if (tier === 'perfect') pop();
    $('rc-again').addEventListener('click', function(){ openDish(DISHES.indexOf(d)); });
    $('rc-home2').addEventListener('click', homeView);
  }

  /* ══ ٥. التصدير ══════════════════════════════════════════════ */
  window._rcPure = {
    DISHES: DISHES,
    ratio: function(d){ return ratioFor(d); },
    target: function(dishId, ingId){
      for (var i=0;i<DISHES.length;i++){
        if (DISHES[i].id === dishId){
          for (var k=0;k<DISHES[i].ing.length;k++){
            if (DISHES[i].ing[k].id === ingId) return targetOf(DISHES[i], DISHES[i].ing[k]);
          }
        }
      }
      return null;
    },
    grade: function(dishId, vals){
      var d = null;
      for (var i=0;i<DISHES.length;i++){ if (DISHES[i].id === dishId) d = DISHES[i]; }
      if (!d) return null;
      var exact = 0, near = 0;
      for (var k=0;k<d.ing.length;k++){
        var want = targetOf(d, d.ing[k]);
        var got = typeof vals[d.ing[k].id] === 'number' ? vals[d.ing[k].id] : 0;
        var diff = Math.abs(got - want);
        if (diff === 0) exact++; else if (diff <= 0.5) near++;
      }
      var tier = exact === d.ing.length ? 'perfect' : (exact + near >= d.ing.length - 1 ? 'near' : 'off');
      return { exact: exact, near: near, total: d.ing.length, tier: tier };
    },
    fmt: fmt,
    progress: function(){ return prog; }
  };

  /* ══ الإقلاع ══════════════════════════════════════════════════ */
  var __booted = false;
  function boot(){ if (__booted) return; __booted = true; homeView(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();

</script>
<script src="js/a11y-mode.js" defer></script>
